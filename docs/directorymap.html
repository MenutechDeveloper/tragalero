<!DOCTYPE html>
<html data-bs-theme="light" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Configura tu Negocio - Tragalero</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/pastel-theme.css">
    <script src="./assets/js/theme.js"></script>

    <style>
        .form-section {
            background: var(--bs-body-bg);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        [data-bs-theme="dark"] .form-section {
            background: #1e293b;
            border-color: rgba(255,255,255,0.05);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--bs-body-color);
            opacity: 0.8;
        }
        .form-control, .form-select {
            border-radius: 15px;
            padding: 12px 20px;
            border: 2px solid rgba(0,0,0,0.05);
            background: rgba(0,0,0,0.02);
        }
        [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.05);
            color: white;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(var(--bs-primary-rgb), 0.1);
            border-color: var(--bs-primary);
        }

        /* Drag & Drop Styles */
        .upload-area {
            border: 2px dashed rgba(0,0,0,0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            background: rgba(0,0,0,0.01);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        [data-bs-theme="dark"] .upload-area {
            border-color: rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--bs-primary);
            background: rgba(var(--bs-primary-rgb), 0.05);
        }
        .upload-area i {
            font-size: 3rem;
            color: var(--bs-primary);
            opacity: 0.5;
        }
        .upload-area p {
            margin-top: 15px;
            font-weight: 600;
            color: var(--bs-body-color);
            opacity: 0.7;
        }
        #filePreview {
            max-width: 150px;
            max-height: 150px;
            border-radius: 15px;
            margin-top: 15px;
            display: none;
        }
        #bizLogo {
            display: none;
        }

        /* Sliding Client Drawer Sidebar */
        .sidebar-container {
            position: fixed; left: 0; top: 120px; z-index: 6000; pointer-events: none; display: flex; align-items: flex-start;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar-container > * { pointer-events: auto; }
        .sidebar-container.collapsed { transform: translateX(-340px) !important; }

        .sidebar-drawer { width: 340px; height: 550px; display: flex; flex-direction: column; gap: 20px; }

        .search-box { background: var(--bs-body-bg, #fff); border: 1px solid rgba(0,0,0,0.1); border-radius: 32px; padding: 24px; position: relative; cursor: default; transition: opacity 0.3s; user-select: none; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.15); height: 100%; display: flex; flex-direction: column; }
        [data-bs-theme="dark"] .search-box { background: #1e293b; border-color: rgba(255,255,255,0.1); }
        .search-box label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--bs-primary, #f2a04a); text-transform: uppercase; margin-bottom: 15px; margin-left: 5px; pointer-events: none; }
        .search-box input { width: 100%; margin-bottom: 15px; border-radius: 16px; padding: 14px; background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.1); color: var(--bs-body-color); }
        [data-bs-theme="dark"] .search-box input { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #fff; }

        .client-list { max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .client-list::-webkit-scrollbar { width: 4px; }
        .client-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        .client-item { padding: 14px 18px; border-radius: 16px; background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; gap: 4px; }
        [data-bs-theme="dark"] .client-item { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.05); }
        .client-item:hover { border-color: var(--bs-primary, #f2a04a); }
        .client-item.active { border-color: var(--bs-primary, #f2a04a); background: rgba(242,160,74,0.1); }
        .client-item .name { font-weight: 700; font-size: 0.85rem; display: block; }
        .client-item .domain { font-size: 0.7rem; opacity: 0.7; }

        .sidebar-tab {
            width: 45px; height: 160px; background: #f2a04a; color: #fff; display: flex; align-items: center; justify-content: center; border-radius: 0 16px 16px 0; cursor: pointer; writing-mode: vertical-lr; text-orientation: mixed; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; box-shadow: 10px 0 30px rgba(242, 160, 74, 0.2); transition: 0.4s; margin-top: 40px; position: relative;
        }
        .sidebar-tab:hover { width: 55px; padding-left: 10px; }

        .btn-panel-link {
            background: var(--bs-primary, #f2a04a);
            color: #fff !important;
            border-radius: 20px;
            font-weight: 800;
            padding: 8px 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .btn-panel-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            filter: brightness(1.05);
        }
    </style>
</head>

<body>

        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center" href="./restaurantapp.html">

    </nav>

    <!-- Sliding Client Drawer Sidebar -->
    <div class="sidebar-container collapsed" id="sidebar-container" style="display: none;">
        <div class="sidebar-drawer" id="sidebar-drawer">
            <div class="search-box">
                <label>Buscar Cliente</label>
                <input type="text" id="client-search" placeholder="Nombre o dominio...">
                <div class="client-list" id="client-list"></div>
                <div id="project-info" style="width: 100%; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); margin-top: auto;">
                    <label style="font-size:0.7rem; font-weight:700; color:var(--bs-primary, #f2a04a); text-transform:uppercase;">Cuenta Activa</label>

                </div>

                                <input type="text" id="bizName" class="form-control" placeholder="Ej. El Herradero" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Logo / Imagen del Restaurante</label>
                                <div class="upload-area" id="dropZone">
                                    <i class="bi bi-cloud-arrow-up"></i>
                                    <p>Arrastra tu logo aquí o haz clic para buscar</p>
                                    <input type="file" id="bizLogo" accept="image/*">
                                    <img id="filePreview" alt="Vista previa">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Location -->
                    <div class="form-section animate-fade-in delay-1">
                        <h5 class="fw-bold mb-4 text-primary"><i class="bi bi-geo-alt me-2"></i>Ubicación</h5>

                                <input type="text" id="bizCity" class="form-control" placeholder="Ej. Tijuana" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Zona / Colonia</label>
                                <input type="text" id="bizState" class="form-control" placeholder="Ej. Zona Río">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Código Postal</label>
                                <input type="text" id="bizZip" class="form-control" placeholder="22000">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Dirección Detallada</label>
                                <input type="text" id="bizAddress" class="form-control" placeholder="Calle, Número, etc.">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Latitud</label>
                                <input type="number" step="any" id="bizLat" class="form-control" placeholder="Ej. 32.5149">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Longitud</label>
                                <input type="number" step="any" id="bizLng" class="form-control" placeholder="Ej. -117.0382">
                            </div>
                            <div class="col-md-12">
                                <button type="button" class="btn btn-sm btn-outline-primary" id="getLocBtn">

                            <div class="col-md-12">

                                <input type="text" id="bizWebsite" class="form-control" placeholder="minegocio.com">
                            </div>
                            <div class="col-md-6">

                                <input type="text" id="bizFB" class="form-control" placeholder="facebook.com/minegocio">
                            </div>
                            <div class="col-md-6">

                            </div>

                                </div>

                            <!-- Tragalero Reservations Button Design -->

                                <label class="form-label">Color de Texto</label>
                                <div class="d-flex align-items-center">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/directory_data.js"></script>
    <script src="./assets/js/supabase_logic.js"></script>

    <script>
        let sessionUser = null;
        let ownerIdParam = null;
        let targetOwnerId = null;
        let existingBiz = null;
        let allOwners = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await renderUserMenu('authButtons');
            sessionUser = await getLoggedInUser();
            if (!sessionUser) {
                window.location.href = './login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            ownerIdParam = urlParams.get('owner_id');
            targetOwnerId = ownerIdParam || sessionUser.id;

            // Security: only Admin can register for someone else
            if (ownerIdParam && ownerIdParam !== sessionUser.id && sessionUser.role !== 'Admin') {
                alert("No tienes permiso para registrar negocios a otros usuarios.");
                window.location.href = './admin.html';
                return;
            }

            if (ownerIdParam && ownerIdParam !== sessionUser.id && sessionUser.role === 'Admin') {
                document.getElementById('adminNav').style.display = 'block';
            }

            const privilegedRoles = ['ADMIN', 'DEVELOPER', 'CS', 'VENTAS', 'SUPPORT', 'DESIGN', 'RETENTION'];
            const userRoleUpper = (sessionUser.role || '').toUpperCase();

            if (privilegedRoles.includes(userRoleUpper)) {
                setupClientDrawer();
            }

            await loadBusinessData(targetOwnerId);
        });

        async function setupClientDrawer() {
            const drawerContainer = document.getElementById('sidebar-container');
            if (drawerContainer) {
                drawerContainer.style.display = 'flex';
                drawerContainer.classList.add('collapsed');
            }

            const sbTab = document.getElementById('sidebar-tab');
            if (sbTab) {
                sbTab.onclick = () => {
                    drawerContainer.classList.toggle('collapsed');
                };
            }

            try {
                const { data, error } = await supabaseClient.from('usuarios').select('*');
                if (error) throw error;
                allOwners = data || [];
                renderOwnersList(allOwners);

                const searchInput = document.getElementById('client-search');
                if (searchInput) {
                    searchInput.oninput = (e) => {
                        const term = e.target.value.toLowerCase();
                        const filtered = allOwners.filter(o =>
                            (o.name || '').toLowerCase().includes(term) ||
                            (o.domain || '').toLowerCase().includes(term) ||
                            (o.email || '').toLowerCase().includes(term)
                        );
                        renderOwnersList(filtered);
                    };
                }
            } catch (e) {
                console.error("Error al cargar lista de usuarios:", e);
            }
        }

        function renderOwnersList(owners) {
            const list = document.getElementById('client-list');
            if (!list) return;
            list.innerHTML = owners.map(o => `
                <div class="client-item ${o.id === targetOwnerId ? 'active' : ''}" onclick="switchContext('${o.id}', '${escapeHtml(o.name || o.domain || o.email || 'Cliente')}')">
                    <span class="name">${escapeHtml(o.name || 'Sin nombre')}</span>
                    <span class="domain">${escapeHtml(o.domain || o.email || '')}</span>
                </div>
            `).join('');
        }

        window.switchContext = async function(ownerId, name) {
            targetOwnerId = ownerId;
            const activeNameEl = document.getElementById('active-project-name');
            if (activeNameEl) activeNameEl.textContent = name;
            renderOwnersList(allOwners);
            await loadBusinessData(targetOwnerId);
        };

        async function loadBusinessData(ownerId) {
            existingBiz = null;
            resetForm();

            // Set active account name label
            const activeUser = allOwners.find(o => o.id === ownerId);
            const activeNameEl = document.getElementById('active-project-name');
            if (activeNameEl) {
                activeNameEl.textContent = activeUser ? (activeUser.name || activeUser.email || activeUser.domain) : sessionUser.name;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('businesses')
                    .select('*')
                    .eq('owner_id', ownerId)
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                if (error && error.code !== 'PGRST116') {
                    console.error("Error al cargar datos del negocio:", error);
                }

                if (data) {
                    existingBiz = data;
                    populateForm(data);
                }
            } catch (err) {
                console.error("Error inesperado al cargar negocio:", err);
            }
        }

        function resetForm() {
            document.getElementById('bizName').value = '';
            document.getElementById('bizCity').value = '';
            document.getElementById('bizState').value = '';
            document.getElementById('bizZip').value = '';
            document.getElementById('bizAddress').value = '';
            document.getElementById('bizLat').value = '';
            document.getElementById('bizLng').value = '';
            document.getElementById('bizWebsite').value = '';
            document.getElementById('bizFB').value = '';
            document.getElementById('bizIG').value = '';
            document.getElementById('bizWA').value = '';
            document.getElementById('bizCuid').value = '';
            document.getElementById('bizRuid').value = '';
            document.getElementById('orderBgColor').value = '#f2a04a';
            document.getElementById('orderBgText').value = '#f2a04a';
            document.getElementById('orderTextColor').value = '#ffffff';
            document.getElementById('orderTextText').value = '#ffffff';
            document.getElementById('resBgColor').value = '#2f4854';
            document.getElementById('resBgText').value = '#2f4854';
            document.getElementById('resTextColor').value = '#ffffff';
            document.getElementById('resTextText').value = '#ffffff';
            document.getElementById('hasReservation').checked = false;
            document.getElementById('bizOrder').value = '';
            document.getElementById('bizReservation').value = '';
            document.getElementById('bizLogo').value = '';

            const filePreview = document.getElementById('filePreview');
            const dropZone = document.getElementById('dropZone');
            filePreview.src = '';
            filePreview.style.display = 'none';
            dropZone.querySelector('i').style.display = 'inline-block';
            dropZone.querySelector('p').style.display = 'block';
        }

        function populateForm(data) {
            if (data.name) document.getElementById('bizName').value = data.name;
            if (data.city) document.getElementById('bizCity').value = data.city;
            if (data.state) document.getElementById('bizState').value = data.state;
            if (data.zip) document.getElementById('bizZip').value = data.zip;
            if (data.address_detail) document.getElementById('bizAddress').value = data.address_detail;
            if (data.latitude) document.getElementById('bizLat').value = data.latitude;
            if (data.longitude) document.getElementById('bizLng').value = data.longitude;
            if (data.website) document.getElementById('bizWebsite').value = data.website;

            if (data.social_media && typeof data.social_media === 'object') {
                if (data.social_media.facebook) document.getElementById('bizFB').value = data.social_media.facebook;
                if (data.social_media.instagram) document.getElementById('bizIG').value = data.social_media.instagram;
                if (data.social_media.whatsapp) document.getElementById('bizWA').value = data.social_media.whatsapp;
            }

            if (data.cuid) document.getElementById('bizCuid').value = data.cuid;
            if (data.ruid) document.getElementById('bizRuid').value = data.ruid;

            if (data.order_bg_color) {
                document.getElementById('orderBgColor').value = data.order_bg_color;
                document.getElementById('orderBgText').value = data.order_bg_color;
            }
            if (data.order_text_color) {
                document.getElementById('orderTextColor').value = data.order_text_color;
                document.getElementById('orderTextText').value = data.order_text_color;
            }
            if (data.res_bg_color) {
                document.getElementById('resBgColor').value = data.res_bg_color;
                document.getElementById('resBgText').value = data.res_bg_color;
            }
            if (data.res_text_color) {
                document.getElementById('resTextColor').value = data.res_text_color;
                document.getElementById('resTextText').value = data.res_text_color;
            }

            document.getElementById('hasReservation').checked = !!data.has_reservation;
            if (data.order_url) document.getElementById('bizOrder').value = data.order_url;
            if (data.reservation_url) document.getElementById('bizReservation').value = data.reservation_url;

            if (data.logo_url) {
                const filePreview = document.getElementById('filePreview');
                const dropZone = document.getElementById('dropZone');
                filePreview.src = data.logo_url;
                filePreview.style.display = 'inline-block';
                dropZone.querySelector('i').style.display = 'none';
                dropZone.querySelector('p').style.display = 'none';
            }
        }

        const form = document.getElementById('businessForm');
        const statusMsg = document.getElementById('statusMsg');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('bizLogo');
        const filePreview = document.getElementById('filePreview');
        const getLocBtn = document.getElementById('getLocBtn');
        const locStatus = document.getElementById('locStatus');

        // Geolocation
        if (getLocBtn) {
            getLocBtn.onclick = () => {
                locStatus.textContent = "Obteniendo ubicación...";
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('bizLat').value = pos.coords.latitude;
                        document.getElementById('bizLng').value = pos.coords.longitude;
                        locStatus.textContent = "Ubicación obtenida con éxito.";
                        locStatus.className = "small mt-1 text-success";
                    },
                    (err) => {
                        console.error(err);
                        locStatus.textContent = "Error al obtener ubicación: " + err.message;
                        locStatus.className = "small mt-1 text-danger";
                    }
                );
            };
        }

        // Drag & Drop Handlers
        dropZone.onclick = () => fileInput.click();

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handlePreview(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                handlePreview(fileInput.files[0]);
            }
        });

        function handlePreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                filePreview.src = e.target.result;
                filePreview.style.display = 'inline-block';
                dropZone.querySelector('i').style.display = 'none';
                dropZone.querySelector('p').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // Color sync helpers
        function setupColorSync(pickerId, textId) {
            const picker = document.getElementById(pickerId);
            const text = document.getElementById(textId);
            picker.oninput = (e) => text.value = e.target.value.toUpperCase();
            text.oninput = (e) => picker.value = e.target.value;
        }

        setupColorSync('orderBgColor', 'orderBgText');
        setupColorSync('orderTextColor', 'orderTextText');
        setupColorSync('resBgColor', 'resBgText');
        setupColorSync('resTextColor', 'resTextText');

        function ensureHttps(url) {
            if (!url) return '';
            url = url.trim();
            if (url === '') return '';
            if (!/^https?:\/\//i.test(url)) {
                return 'https://' + url;
            }
            return url;
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';

            statusMsg.className = 'alert d-none';

            try {
                // Check business limit for target user if creating brand new business
                if (!existingBiz && sessionUser.role !== 'Admin') {
                    const { count, error: countError } = await supabaseClient
                        .from('businesses')
                        .select('*', { count: 'exact', head: true })
                        .eq('owner_id', targetOwnerId);

                    if (countError) throw countError;

                    // Fetch user specific limit
                    const { data: userData, error: userError } = await supabaseClient
                        .from('usuarios')
                        .select('max_businesses, is_active')
                        .eq('id', targetOwnerId)
                        .single();

                    if (userError) throw userError;
                    if (!userData.is_active) throw new Error("La cuenta seleccionada está suspendida.");

                    if (count >= userData.max_businesses) {
                        throw new Error(`Límite alcanzado (${userData.max_businesses} negocios).`);
                    }
                }

                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Subiendo...';

                const logoFile = fileInput.files[0];
                let logoUrl = existingBiz ? existingBiz.logo_url : '';

                if (logoFile) {
                    try {
                        const uploadRes = await uploadToCloudinary(logoFile);
                        logoUrl = uploadRes.url;
                    } catch (uploadError) {
                        throw new Error("Error al subir la imagen: " + uploadError.message);
                    }
                }

                const bizData = {
                    owner_id: targetOwnerId,
                    name: document.getElementById('bizName').value,
                    category: 'Restaurantes',
                    city: document.getElementById('bizCity').value,
                    state: document.getElementById('bizState').value,
                    zip: document.getElementById('bizZip').value,
                    address_detail: document.getElementById('bizAddress').value,
                    latitude: document.getElementById('bizLat').value ? parseFloat(document.getElementById('bizLat').value) : null,
                    longitude: document.getElementById('bizLng').value ? parseFloat(document.getElementById('bizLng').value) : null,
                    logo_url: logoUrl,
                    website: ensureHttps(document.getElementById('bizWebsite').value),
                    is_restaurant: true,
                    cuid: document.getElementById('bizCuid').value,
                    ruid: document.getElementById('bizRuid').value,
                    order_bg_color: document.getElementById('orderBgColor').value,
                    order_text_color: document.getElementById('orderTextColor').value,
                    res_bg_color: document.getElementById('resBgColor').value,
                    res_text_color: document.getElementById('resTextColor').value,
                    has_reservation: document.getElementById('hasReservation').checked,
                    order_url: ensureHttps(document.getElementById('bizOrder').value),
                    reservation_url: ensureHttps(document.getElementById('bizReservation').value),
                    social_media: {
                        facebook: ensureHttps(document.getElementById('bizFB').value),
                        instagram: ensureHttps(document.getElementById('bizIG').value),
                        whatsapp: document.getElementById('bizWA').value
                    }
                };

                if (existingBiz && existingBiz.id) {
                    const { error: updateError } = await supabaseClient
                        .from('businesses')
                        .update(bizData)
                        .eq('id', existingBiz.id);

                    if (updateError) throw updateError;
                } else {
                    const { data: newBiz, error: insertError } = await supabaseClient
                        .from('businesses')
                        .insert([bizData])
                        .select()
                        .single();

                    if (insertError) throw insertError;
                    existingBiz = newBiz;
                }

                statusMsg.textContent = '¡Información del restaurante guardada con éxito!';
                statusMsg.className = 'alert alert-success d-block';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Guardar y Publicar';

            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Error: ' + err.message;
                statusMsg.className = 'alert alert-danger d-block';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-upload me-2"></i>Guardar y Publicar';
            }
        };
    </script>
</body>

</html>
