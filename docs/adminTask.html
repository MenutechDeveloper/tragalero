<!DOCTYPE html>
<html data-bs-theme="dark" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Gestión de Tareas CS | Tragalero</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/pastel-theme.css">
    <script src="./assets/js/theme.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .task-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .header-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-img {
            height: 55px;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s ease;
        }

        [data-bs-theme="light"] .stat-card {
            background: #ffffff;
            border-color: #f1f5f9;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .task-card-table {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        [data-bs-theme="light"] .task-card-table {
            background: #ffffff;
            border-color: #f1f5f9;
        }

        .img-thumb {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .img-thumb:hover {
            transform: scale(1.1);
        }

        /* Sidebar Container */
        .sidebar-container {
            position: fixed; left: 0; top: 120px; z-index: 6000; pointer-events: none; display: flex; align-items: flex-start;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar-container > * { pointer-events: auto; }
        .sidebar-container.collapsed { transform: translateX(-340px) !important; }

        .sidebar { width: 340px; height: 600px; display: flex; flex-direction: column; gap: 20px; }

        .search-box {
            background: var(--bs-body-bg); border: 1px solid rgba(255,149,51,0.3); border-radius: 32px; padding: 24px;
            position: relative; cursor: default; transition: opacity 0.3s; user-select: none; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.2); height: 100%; display: flex; flex-direction: column;
        }
        .search-box label { display: block; font-size: 0.7rem; font-weight: 700; color: #ff9533; text-transform: uppercase; margin-bottom: 15px; margin-left: 5px; }
        .search-box input { width: 100%; margin-bottom: 15px; border-radius: 16px; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--bs-body-color); }

        .client-list { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .client-item { padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: 0.3s; }
        .client-item:hover { border-color: #ff9533; }
        .client-item.active { border-color: #ff9533; background: rgba(255,149,51,0.15); }

        .sidebar-tab {
            width: 45px; height: 160px; background: #ff9533; color: #fff; display: flex; align-items: center; justify-content: center; border-radius: 0 16px 16px 0; cursor: pointer; writing-mode: vertical-lr; text-orientation: mixed; font-weight: 800; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; box-shadow: 10px 0 30px rgba(255, 149, 51, 0.2); transition: 0.4s; margin-top: 40px;
        }

        .btn-panel-top {
            background: #ff9533; color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: 0.4s; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-panel-top:hover { color: #fff; transform: translateY(-2px); filter: brightness(1.1); }

        .top-navbar {
            position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 5000; pointer-events: none;
        }
        .top-navbar > * { pointer-events: auto; }
    </style>
</head>

<body>
    <!-- Top Navigation Bar -->
    <div class="top-navbar">
        <a href="admin.html" class="btn-panel-top"><i class="bi bi-arrow-left"></i> PANEL</a>
        <div class="theme-switcher-container d-flex align-items-center bg-white bg-opacity-10 p-2 rounded-pill shadow-sm">
            <div id="authButtons" class="me-3 ps-2"></div>
            <div class="theme-switcher-bar d-flex">
                <button class="theme-btn" data-theme-value="light" title="Modo Amarillo"><i class="bi bi-sun-fill"></i></button>
                <button class="theme-btn" data-theme-value="dark" title="Modo Oscuro"><i class="bi bi-moon-stars-fill"></i></button>
                <button class="theme-btn" data-theme-value="medio" title="Modo Suave"><i class="bi bi-palette-fill"></i></button>
            </div>
        </div>
    </div>

    <!-- Sidebar Client Drawer (CS / Admin context switcher) -->
    <div class="sidebar-container collapsed hidden" id="sidebar-container">
        <div class="sidebar" id="sidebar">
            <div class="search-box">
                <label>Filtrar por Cliente</label>
                <input type="text" id="client-search" placeholder="Buscar cliente...">
                <div class="client-list" id="client-list"></div>
            </div>
        </div>
        <div class="sidebar-tab" id="sidebar-tab"><i class="bi bi-people-fill me-1"></i> Clientes</div>
    </div>

    <div class="task-layout" style="margin-top: 60px;">
        <!-- Header -->
        <div class="header-section">
            <img src="./assets/img/tragalero.png" alt="Tragalero Logo" class="logo-img logo-main">
            <h2 class="fw-bold mb-1">Gestión de Tareas y Solicitudes</h2>
        </div>

        <!-- Stat Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon bg-primary bg-opacity-20 text-primary">
                    <i class="bi bi-list-task"></i>
                </div>
                <div>
                    <div class="fs-4 fw-bold" id="stat-total">0</div>
                    <div class="small text-muted">Total Tareas</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-warning bg-opacity-20 text-warning">
                    <i class="bi bi-clock-history"></i>
                </div>
                <div>
                    <div class="fs-4 fw-bold" id="stat-pending">0</div>
                    <div class="small text-muted">Pendientes</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-info bg-opacity-20 text-info">
                    <i class="bi bi-gear-wide-connected"></i>
                </div>
                <div>
                    <div class="fs-4 fw-bold" id="stat-progress">0</div>
                    <div class="small text-muted">En Proceso</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-success bg-opacity-20 text-success">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <div>
                    <div class="fs-4 fw-bold" id="stat-completed">0</div>
                    <div class="small text-muted">Completadas</div>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="task-card-table">
            <!-- Controls Bar -->
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                <div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 450px;">
                    <i class="bi bi-search text-muted"></i>
                    <input type="text" id="search-input" class="form-control rounded-pill bg-body border-secondary border-opacity-25" placeholder="Buscar por título, descripción o cliente...">
                </div>
                <div class="d-flex align-items-center gap-2">
                    <select id="status-filter" class="form-select rounded-pill bg-body border-secondary border-opacity-25" style="width: auto;">
                        <option value="ALL">Todos los Estados</option>
                        <option value="Pendiente">Pendientes</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Completada">Completadas</option>
                        <option value="Cancelada">Canceladas</option>
                    </select>
                    <button class="btn btn-warning rounded-pill px-3 text-white fw-bold" onclick="openNewTaskModal()">
                        <i class="bi bi-plus-lg me-1"></i> Nueva Tarea
                    </button>
                </div>
            </div>

            <!-- Tasks Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr class="text-muted small text-uppercase">
                            <th>Cliente</th>
                            <th>Solicitud / Tarea</th>
                            <th class="text-center">Adjunto</th>
                            <th>Fecha Creación</th>
                            <th>Fecha Límite (5 días)</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-table-body">
                        <tr>
                            <td colspan="7" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm me-2 text-warning" role="status"></div>
                                Cargando tareas...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark text-white rounded-4 border-0">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold" id="imageModalTitle">Vista Previa del Adjunto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <img id="modalPreviewImage" src="" class="img-fluid rounded-3 shadow" style="max-height: 70vh;" alt="Adjunto">
                </div>
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div class="modal fade" id="newTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Crear Nueva Tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newTaskForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Título de la Solicitud</label>
                            <input type="text" id="task-title" class="form-control rounded-3" placeholder="Ej. Publicar Post en Facebook" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Descripción / Instrucciones</label>
                            <textarea id="task-desc" class="form-control rounded-3" rows="3" placeholder="Detalles de la tarea..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Imagen / Adjunto (Opcional)</label>
                            <input type="file" id="task-file" class="form-control rounded-3" accept="image/*">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning text-white rounded-pill px-4 fw-bold" onclick="saveNewTask()">Guardar Tarea</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase_logic.js"></script>

    <script>
        const sb = supabaseClient;
        let currentUser = null;
        let allTasks = [];
        let allOwners = [];
        let activeFilterOwnerId = 'ALL';

        document.addEventListener('DOMContentLoaded', async () => {
            await renderUserMenu('authButtons');
            currentUser = await getLoggedInUser();

            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const role = (currentUser?.role || '').toUpperCase();
            if (['ADMIN', 'DEVELOPER', 'CS', 'VENTAS'].includes(role)) {
                document.getElementById('sidebar-container').classList.remove('hidden');
                document.getElementById('sidebar-container').classList.add('collapsed');
                await setupContextSwitcher();
            }

            document.getElementById('sidebar-tab').onclick = () => {
                document.getElementById('sidebar-container').classList.toggle('collapsed');
            };

            document.getElementById('search-input').addEventListener('input', renderTasksTable);
            document.getElementById('status-filter').addEventListener('change', renderTasksTable);

            await loadTasks();
            setupRealtimeSubscription();
        });

        async function setupContextSwitcher() {
            const { data } = await sb.from('usuarios').select('*');
            allOwners = data || [];
            renderOwners(allOwners);

            document.getElementById('client-search').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                renderOwners(allOwners.filter(o => (o.name||'').toLowerCase().includes(term) || (o.domain||'').toLowerCase().includes(term) || (o.email||'').toLowerCase().includes(term)));
            };
        }

        function renderOwners(owners) {
            const list = document.getElementById('client-list');
            let html = `<div class="client-item ${activeFilterOwnerId === 'ALL' ? 'active' : ''}" onclick="filterByOwner('ALL')"><span class="fw-bold">Todos los Clientes</span></div>`;
            html += owners.map(o => `
                <div class="client-item ${activeFilterOwnerId === o.id ? 'active' : ''}" onclick="filterByOwner('${o.id}')">
                    <span class="d-block fw-bold small">${o.name || o.email || 'Cliente'}</span>
                    <span class="d-block text-muted" style="font-size:0.75rem">${o.domain || o.email}</span>
                </div>
            `).join('');
            list.innerHTML = html;
        }

        window.filterByOwner = (ownerId) => {
            activeFilterOwnerId = ownerId;
            renderOwners(allOwners);
            renderTasksTable();
        };

        async function loadTasks() {
            let query = sb.from('tragalero_tasks').select('*').order('created_at', { ascending: false });

            // If normal owner user, filter to their own tasks
            const role = (currentUser?.role || '').toUpperCase();
            if (!['ADMIN', 'DEVELOPER', 'CS', 'VENTAS'].includes(role)) {
                query = query.eq('user_id', currentUser.id);
            }

            const { data, error } = await query;
            if (error) {
                console.error("Error al cargar tareas:", error.message);
            }
            allTasks = data || [];
            updateStats();
            renderTasksTable();
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = allTasks.length;
            document.getElementById('stat-pending').textContent = allTasks.filter(t => t.status === 'Pendiente').length;
            document.getElementById('stat-progress').textContent = allTasks.filter(t => t.status === 'En Proceso').length;
            document.getElementById('stat-completed').textContent = allTasks.filter(t => t.status === 'Completada').length;
        }

        function renderTasksTable() {
            const tbody = document.getElementById('tasks-table-body');
            const search = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            let filtered = allTasks.filter(t => {
                const matchesSearch = (t.title || '').toLowerCase().includes(search) ||
                                      (t.description || '').toLowerCase().includes(search) ||
                                      (t.client_name || '').toLowerCase().includes(search) ||
                                      (t.client_domain || '').toLowerCase().includes(search);

                const matchesStatus = statusFilter === 'ALL' || t.status === statusFilter;
                const matchesOwner = activeFilterOwnerId === 'ALL' || t.user_id === activeFilterOwnerId;

                return matchesSearch && matchesStatus && matchesOwner;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                            No se encontraron tareas registradas.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(t => {
                const createdDate = t.created_at ? new Date(t.created_at).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';

                let dueDateFormatted = '-';
                let daysLeftBadge = '';
                if (t.due_date) {
                    const due = new Date(t.due_date);
                    dueDateFormatted = due.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
                    const now = new Date();
                    const diffTime = due - now;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (t.status !== 'Completada' && t.status !== 'Cancelada') {
                        if (diffDays < 0) {
                            daysLeftBadge = `<span class="badge bg-danger ms-1">Vencida</span>`;
                        } else if (diffDays <= 2) {
                            daysLeftBadge = `<span class="badge bg-warning text-dark ms-1">${diffDays} días restantes</span>`;
                        } else {
                            daysLeftBadge = `<span class="badge bg-secondary ms-1">${diffDays} días</span>`;
                        }
                    }
                }

                let statusBadge = 'bg-warning text-dark';
                if (t.status === 'En Proceso') statusBadge = 'bg-info text-dark';
                if (t.status === 'Completada') statusBadge = 'bg-success';
                if (t.status === 'Cancelada') statusBadge = 'bg-secondary';

                return `
                    <tr>
                        <td>
                            <div class="fw-bold">${escapeHtml(t.client_name || 'Cliente')}</div>
                            <div class="small text-muted">${escapeHtml(t.client_domain || '')}</div>
                        </td>
                        <td>
                            <div class="fw-bold">${escapeHtml(t.title)}</div>
                            <div class="small text-muted text-truncate" style="max-width: 280px;" title="${escapeHtml(t.description || '')}">${escapeHtml(t.description || 'Sin descripción')}</div>
                        </td>
                        <td class="text-center">
                            ${t.image_url ? `<img src="${t.image_url}" class="img-thumb" onclick="openImageModal('${t.image_url}', '${escapeHtml(t.title)}')">` : '<span class="text-muted small">-</span>'}
                        </td>
                        <td class="small">${createdDate}</td>
                        <td class="small">
                            <div>${dueDateFormatted}</div>
                            ${daysLeftBadge}
                        </td>
                        <td>
                            <select class="form-select form-select-sm rounded-pill border-0 fw-bold ${statusBadge}" style="width: 120px;" onchange="updateTaskStatus('${t.id}', this.value)">
                                <option value="Pendiente" ${t.status==='Pendiente'?'selected':''}>Pendiente</option>
                                <option value="En Proceso" ${t.status==='En Proceso'?'selected':''}>En Proceso</option>
                                <option value="Completada" ${t.status==='Completada'?'selected':''}>Completada</option>
                                <option value="Cancelada" ${t.status==='Cancelada'?'selected':''}>Cancelada</option>
                            </select>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-danger rounded-circle ms-1" title="Eliminar Tarea" onclick="deleteTask('${t.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.openImageModal = (url, title) => {
            document.getElementById('modalPreviewImage').src = url;
            document.getElementById('imageModalTitle').textContent = title;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        };

        window.openNewTaskModal = () => {
            document.getElementById('newTaskForm').reset();
            new bootstrap.Modal(document.getElementById('newTaskModal')).show();
        };

        window.saveNewTask = async () => {
            const title = document.getElementById('task-title').value;
            const desc = document.getElementById('task-desc').value;
            const fileInput = document.getElementById('task-file');

            if (!title) {
                alert("Por favor ingresa un título para la tarea.");
                return;
            }

            let imageUrl = null;
            if (fileInput.files.length > 0) {
                try {
                    const upload = await uploadToCloudinary(fileInput.files[0]);
                    imageUrl = upload.url;
                } catch (e) {
                    alert("Error al subir la imagen: " + e.message);
                    return;
                }
            }

            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 5);

            const { error } = await sb.from('tragalero_tasks').insert({
                user_id: currentUser.id,
                client_name: currentUser.name || 'Cliente',
                client_domain: currentUser.domain || 'tragalero',
                title: title,
                description: desc,
                image_url: imageUrl,
                due_date: dueDate.toISOString(),
                status: 'Pendiente'
            });

            if (error) {
                alert("Error al guardar tarea: " + error.message);
            } else {
                bootstrap.Modal.getInstance(document.getElementById('newTaskModal')).hide();
                await loadTasks();
            }
        };

        window.updateTaskStatus = async (taskId, newStatus) => {
            const { error } = await sb.from('tragalero_tasks').update({
                status: newStatus,
                updated_at: new Date().toISOString()
            }).eq('id', taskId);

            if (error) {
                alert("Error al actualizar estado: " + error.message);
            } else {
                await loadTasks();
            }
        };

        window.deleteTask = async (taskId) => {
            if (!confirm("¿Estás seguro de que deseas eliminar esta tarea?")) return;

            const { error } = await sb.from('tragalero_tasks').delete().eq('id', taskId);
            if (error) {
                alert("Error al eliminar tarea: " + error.message);
            } else {
                await loadTasks();
            }
        };

        function setupRealtimeSubscription() {
            sb.channel('tasks-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tragalero_tasks' }, () => {
                    loadTasks();
                })
                .subscribe();
        }
    </script>
    <script src="./assets/js/tragaleroChatbot.js"></script>
</body>

</html>
