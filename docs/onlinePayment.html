<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos en Línea | Tragalero</title>
    <link rel="icon" type="image/png" href="./assets/img/tragalero_negro.png">
    <link rel="shortcut icon" href="./assets/img/tragalero_negro.png">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            --orange: #ff9533;
            --bg: #fffcf0;
            --card: #ffffff;
            --input: #fffef5;
            --text: #1a1c1e;
            --text-dim: #4a5568;
            --border: #f8e8d8;
            --success: #10b981;
            --error: #dc2626;
            --stripe-purple: #635bff;
            --mp-blue: #009ee3;
        }

        body.dark-mode {
            --bg: #121418;
            --card: #1c1f26;
            --input: #242933;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d333f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        .bg-mesh { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 0% 0%, rgba(255, 149, 51, 0.12) 0%, transparent 40%), radial-gradient(circle at 100% 100%, rgba(255, 149, 51, 0.08) 0%, transparent 40%); }

        /* Navigation Top Bar */
        #top-nav { position: fixed; top: 24px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; z-index: 5000; pointer-events: none; }
        #top-nav > * { pointer-events: auto; }

        .btn-panel-top { background: var(--orange); color: #fff; border: none; padding: 12px 28px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: 0.4s; letter-spacing: 1.5px; box-shadow: 0 8px 25px rgba(255, 149, 51, 0.3); text-transform: uppercase; }
        .btn-panel-top:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 149, 51, 0.4); filter: brightness(1.1); }

        .theme-switch {
            width: 50px; height: 50px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .theme-switch:hover { transform: translateY(-2px); border-color: var(--orange); }

        /* User Pill */
        #user-display-pill {
            background: var(--card); backdrop-filter: blur(20px); padding: 8px 24px; border-radius: 40px; border: 1.5px solid var(--border);
            display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); cursor: pointer; position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; min-width: 220px; justify-content: flex-start;
        }
        #user-display-pill:hover { transform: translateY(-2px); border-color: var(--orange); box-shadow: 0 15px 45px rgba(255,149,51,0.15); }
        .pill-info { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
        #user-name { font-weight: 800; font-size: 0.85rem; font-family: 'Outfit', sans-serif; }
        #user-role-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        .pill-menu {
            position: absolute; top: calc(100% + 12px); right: 0; background: var(--card) !important; border: 1px solid var(--border);
            border-radius: 24px; padding: 12px; min-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            opacity: 0; transform: translateY(10px); pointer-events: none; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 6000;
        }
        #user-display-pill.active .pill-menu { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .pill-menu-item {
            padding: 12px 18px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; color: var(--text);
            display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; text-decoration: none;
        }
        .pill-menu-item:hover { background: rgba(255, 149, 51, 0.1); color: var(--orange); }
        .pill-menu-item.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--error); }

        /* Container & Header */
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 100px 24px 60px 24px; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 40px; }
        .logo-main { max-width: 180px; height: auto; margin: 0 auto 15px auto; display: block; filter: drop-shadow(0 10px 20px rgba(255,149,51,0.15)); }

        .page-title { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
        .page-subtitle { color: var(--text-dim); font-size: 0.95rem; font-weight: 500; }

        .account-badge {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255,149,51,0.1); border: 1px solid var(--orange);
            color: var(--orange); padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; margin-top: 15px;
        }

        /* Layout Grid */
        .payment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-top: 30px; }
        @media (max-width: 900px) { .payment-grid { grid-template-columns: 1fr; } }

        /* Payment Cards */
        .payment-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden;
        }
        .payment-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,0.08); }

        .card-header-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .brand-title { display: flex; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; }
        .brand-icon-stripe { width: 42px; height: 42px; border-radius: 12px; background: var(--stripe-purple); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 8px 20px rgba(99,91,255,0.3); }
        .brand-icon-mp { width: 42px; height: 42px; border-radius: 12px; background: var(--mp-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 8px 20px rgba(0,158,227,0.3); }

        .status-badge { font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 12px; text-transform: uppercase; }
        .status-badge.connected { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid var(--success); }
        .status-badge.disconnected { background: rgba(220,38,38,0.1); color: var(--error); border: 1px solid var(--error); }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--orange); letter-spacing: 0.5px; }
        .input-field {
            width: 100%; background: var(--input); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px;
            color: var(--text); font-size: 0.9rem; font-weight: 600; transition: 0.3s;
        }
        .input-field:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255, 149, 51, 0.08); }

        /* Toggle Switch */
        .switch-row { display: flex; align-items: center; justify-content: space-between; background: var(--input); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border); }
        .switch-label { font-size: 0.85rem; font-weight: 700; }

        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Buttons */
        .btn-action {
            padding: 14px 24px; border-radius: 16px; border: none; font-weight: 800; font-size: 0.85rem; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-stripe { background: var(--stripe-purple); color: #fff; box-shadow: 0 8px 20px rgba(99,91,255,0.25); }
        .btn-stripe:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(99,91,255,0.35); }

        .btn-mp { background: var(--mp-blue); color: #fff; box-shadow: 0 8px 20px rgba(0,158,227,0.25); }
        .btn-mp:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0,158,227,0.35); }

        .btn-save-all {
            background: var(--orange); color: #fff; width: 100%; padding: 18px; border-radius: 20px; font-weight: 800; font-size: 1rem;
            text-transform: uppercase; border: none; cursor: pointer; margin-top: 30px; letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(255,149,51,0.3); transition: 0.3s;
        }
        .btn-save-all:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255,149,51,0.4); filter: brightness(1.05); }

        /* Sidebar Client Drawer */
        .sidebar-container {
            position: fixed; left: 0; top: 120px; z-index: 6000; pointer-events: none; display: flex; align-items: flex-start;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar-container > * { pointer-events: auto; }
        .sidebar-container.collapsed { transform: translateX(-340px) !important; }

        .sidebar-drawer { width: 340px; height: 550px; display: flex; flex-direction: column; gap: 20px; }
        .search-box {
            background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 24px; position: relative;
            cursor: default; transition: opacity 0.3s; user-select: none; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            height: 100%; display: flex; flex-direction: column;
        }
        .search-box label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--orange); text-transform: uppercase; margin-bottom: 15px; margin-left: 5px; }
        .search-box input { width: 100%; margin-bottom: 15px; border-radius: 16px; padding: 14px; background: var(--input); border: 1px solid var(--border); color: var(--text); }

        .client-list { max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .client-list::-webkit-scrollbar { width: 4px; }
        .client-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .client-item { padding: 14px 18px; border-radius: 16px; background: var(--input); border: 1px solid var(--border); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; gap: 4px; }
        .client-item:hover { border-color: var(--orange); }
        .client-item.active { border-color: var(--orange); background: rgba(255,149,51,0.08); }
        .client-item .name { font-weight: 700; font-size: 0.85rem; display: block; }
        .client-item .domain { font-size: 0.7rem; color: var(--text-dim); }

        .sidebar-tab {
            width: 45px; height: 160px; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center;
            border-radius: 0 16px 16px 0; cursor: pointer; writing-mode: vertical-lr; text-orientation: mixed; font-weight: 800;
            font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; box-shadow: 10px 0 30px rgba(255, 149, 51, 0.2); transition: 0.4s; margin-top: 40px;
        }
        .sidebar-tab:hover { width: 55px; padding-left: 10px; }

        /* Toast Container */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 20000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { min-width: 300px; max-width: 440px; padding: 16px 20px; border-radius: 20px; background: #1c1f26; border: 1px solid var(--border); color: #fff; font-size: 0.85rem; font-weight: 600; box-shadow: 0 12px 32px rgba(0,0,0,0.3); pointer-events: auto; animation: toastSlide 0.4s ease-out; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--error); }
        @keyframes toastSlide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hidden { display: none !important; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase_logic.js"></script>
    <script src="./assets/js/theme.js"></script>
</head>
<body>
    <div class="bg-mesh"></div>
    <div id="toast-container"></div>

    <!-- Navigation Top Bar -->
    <div id="top-nav">
        <div><button class="btn-panel-top" onclick="location.href='admin.html'">PANEL</button></div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="theme-switch" id="theme-toggle">
                <i class="bi bi-sun-fill" style="color:var(--orange); font-size:1.2rem;" id="theme-icon"></i>
            </div>
            <div id="user-display-pill">
                <i class="bi bi-person-circle" style="font-size:1.2rem;"></i>
                <div class="pill-info">
                    <div id="user-name">Cargando...</div>
                    <div id="user-role-label">Role</div>
                </div>
                <div class="pill-menu">
                    <a href="admin.html" class="pill-menu-item"><i class="bi bi-grid-fill"></i> Panel</a>
                    <div class="pill-menu-item danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sliding Client Drawer Sidebar -->
    <div class="sidebar-container collapsed hidden" id="sidebar-container">
        <div class="sidebar-drawer" id="sidebar-drawer">
            <div class="search-box">
                <label>Buscar Cliente</label>
                <input type="text" id="client-search" placeholder="Buscar por nombre o email...">
                <div class="client-list" id="client-list"></div>
                <div id="project-info" style="width: 100%; padding-top: 15px; border-top: 1px solid var(--border); margin-top: auto;">
                    <label style="font-size:0.7rem; font-weight:700; color:var(--orange); text-transform:uppercase;">Cuenta Activa</label>
                    <div id="active-project-name" style="font-weight: 700; padding: 12px; background: var(--input); border-radius: 14px; border: 1px solid var(--border); font-size: 0.8rem; margin-top: 8px;">Ninguna seleccionada</div>
                </div>
            </div>
        </div>
        <div class="sidebar-tab" id="sidebar-tab">Clientes</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <header>
            <img src="./assets/img/tragalero_negro.png" class="logo-main" alt="Tragalero Logo">
            <h1 class="page-title">Configuración de Pagos en Línea</h1>
            <p class="page-subtitle">Conecta tus cuentas de Stripe y Mercado Pago para recibir cobros directos de tus clientes</p>
            <div class="account-badge" id="current-account-badge">
                <i class="bi bi-shop"></i> <span id="current-account-text">Cuenta Propietario</span>
            </div>
        </header>

        <form id="payment-form" onsubmit="savePaymentConfig(event)">
            <div class="payment-grid">
                <!-- Stripe Card -->
                <div class="payment-card">
                    <div class="card-header-bar">
                        <div class="brand-title">
                            <div class="brand-icon-stripe"><i class="bi bi-credit-card-fill"></i></div>
                            Stripe Connect
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span id="stripe_status_badge" class="status-badge disconnected">Sin conectar</span>
                            <div class="switch-row" style="padding: 6px 12px; gap: 10px;">
                                <span class="switch-label">Activar</span>
                                <label class="switch">
                                    <input type="checkbox" id="stripe_enabled">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Stripe Account ID (acct_...)</label>
                        <input type="text" id="stripe_account_id" class="input-field" placeholder="acct_1Nxxxxxxxxxxxx">
                    </div>

                    <div class="form-group">
                        <label>Publishable Key (pk_test / pk_live)</label>
                        <input type="text" id="stripe_publishable_key" class="input-field" placeholder="pk_live_...">
                    </div>

                    <div class="form-group">
                        <label>Secret Key (sk_test / sk_live)</label>
                        <input type="password" id="stripe_secret_key" class="input-field" placeholder="sk_live_...">
                    </div>

                    <button type="button" class="btn-action btn-stripe" onclick="testStripeConnection()">
                        <i class="bi bi-lightning-charge-fill"></i> Probar Conexión Stripe
                    </button>
                </div>

                <!-- Mercado Pago Card -->
                <div class="payment-card">
                    <div class="card-header-bar">
                        <div class="brand-title">
                            <div class="brand-icon-mp"><i class="bi bi-wallet2"></i></div>
                            Mercado Pago
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span id="mp_status_badge" class="status-badge disconnected">Sin conectar</span>
                            <div class="switch-row" style="padding: 6px 12px; gap: 10px;">
                                <span class="switch-label">Activar</span>
                                <label class="switch">
                                    <input type="checkbox" id="mercadopago_enabled">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>User ID / Collector ID</label>
                        <input type="text" id="mercadopago_user_id" class="input-field" placeholder="Ej. 123456789">
                    </div>

                    <div class="form-group">
                        <label>Public Key (APP_USR-...)</label>
                        <input type="text" id="mercadopago_public_key" class="input-field" placeholder="APP_USR-...">
                    </div>

                    <div class="form-group">
                        <label>Access Token (APP_USR-...)</label>
                        <input type="password" id="mercadopago_access_token" class="input-field" placeholder="APP_USR-...">
                    </div>

                    <button type="button" class="btn-action btn-mp" onclick="testMPConnection()">
                        <i class="bi bi-lightning-charge-fill"></i> Probar Conexión Mercado Pago
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-save-all" id="btn-save">
                <i class="bi bi-floppy-fill me-2"></i> Guardar Configuración de Pagos
            </button>
        </form>
    </div>

    <script>
        const sb = supabaseClient;

        let user = null;
        let userRole = 'Owner';
        let activeOwnerId = null;
        let allOwners = [];

        async function init() {
            initEvents();

            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                location.href = 'login.html';
                return;
            }
            user = session.user;

            const { data: profile } = await sb.from('usuarios').select('*').eq('id', user.id).single();
            if (profile) {
                userRole = profile.role || 'Owner';
                document.getElementById('user-name').textContent = profile.name || user.email;
                document.getElementById('user-role-label').textContent = userRole;
            } else {
                document.getElementById('user-name').textContent = user.email.split('@')[0];
                document.getElementById('user-role-label').textContent = 'Owner';
            }

            activeOwnerId = user.id;

            const privilegedRoles = ['ADMIN', 'DEVELOPER', 'CS', 'VENTAS'];
            if (privilegedRoles.includes(userRole.toUpperCase())) {
                document.getElementById('sidebar-container').classList.remove('hidden');
                setupClientDrawer();
            }

            await loadPaymentConfig(activeOwnerId);
        }

        function initEvents() {
            const pill = document.getElementById('user-display-pill');
            if (pill) {
                pill.onclick = (e) => { e.stopPropagation(); pill.classList.toggle('active'); };
                document.addEventListener('click', () => pill.classList.remove('active'));
            }

            const sbTab = document.getElementById('sidebar-tab');
            if (sbTab) {
                sbTab.onclick = () => {
                    document.getElementById('sidebar-container').classList.toggle('collapsed');
                };
            }

            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.onclick = () => {
                    document.body.classList.toggle('dark-mode');
                    const isDark = document.body.classList.contains('dark-mode');
                    document.getElementById('theme-icon').className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
                };
            }
        }

        async function setupClientDrawer() {
            const { data } = await sb.from('usuarios').select('*');
            allOwners = data || [];
            renderOwners(allOwners);

            document.getElementById('client-search').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                renderOwners(allOwners.filter(o =>
                    (o.name || '').toLowerCase().includes(term) ||
                    (o.email || '').toLowerCase().includes(term) ||
                    (o.domain || '').toLowerCase().includes(term)
                ));
            };
        }

        function renderOwners(owners) {
            const list = document.getElementById('client-list');
            if (!list) return;
            list.innerHTML = owners.map(o => `
                <div class="client-item ${activeOwnerId === o.id ? 'active' : ''}" onclick="switchContext('${o.id}', '${o.name || o.email}')">
                    <span class="name">${o.name || o.email}</span>
                    <span class="domain">${o.domain || o.email}</span>
                </div>
            `).join('');
        }

        window.switchContext = async (ownerId, ownerName) => {
            activeOwnerId = ownerId;
            document.getElementById('current-account-text').textContent = ownerName;
            document.getElementById('active-project-name').textContent = ownerName;
            renderOwners(allOwners);
            await loadPaymentConfig(activeOwnerId);
            showToast(`Cambiaste a la cuenta: ${ownerName}`);
        };

        async function loadPaymentConfig(ownerId) {
            resetForm();

            try {
                const { data, error } = await sb
                    .from('tragalero_payment_config')
                    .select('*')
                    .eq('user_id', ownerId)
                    .single();

                if (data) {
                    document.getElementById('stripe_account_id').value = data.stripe_account_id || '';
                    document.getElementById('stripe_publishable_key').value = data.stripe_publishable_key || '';
                    document.getElementById('stripe_secret_key').value = data.stripe_secret_key || '';
                    document.getElementById('stripe_enabled').checked = !!data.stripe_enabled;

                    updateStatusBadge('stripe_status_badge', data.stripe_status || (data.stripe_enabled ? 'connected' : 'disconnected'));

                    document.getElementById('mercadopago_user_id').value = data.mercadopago_user_id || '';
                    document.getElementById('mercadopago_public_key').value = data.mercadopago_public_key || '';
                    document.getElementById('mercadopago_access_token').value = data.mercadopago_access_token || '';
                    document.getElementById('mercadopago_enabled').checked = !!data.mercadopago_enabled;

                    updateStatusBadge('mp_status_badge', data.mercadopago_status || (data.mercadopago_enabled ? 'connected' : 'disconnected'));
                }
            } catch (e) {
                console.log("Sin configuración previa de pagos para este usuario.");
            }
        }

        function resetForm() {
            document.getElementById('stripe_account_id').value = '';
            document.getElementById('stripe_publishable_key').value = '';
            document.getElementById('stripe_secret_key').value = '';
            document.getElementById('stripe_enabled').checked = false;
            updateStatusBadge('stripe_status_badge', 'disconnected');

            document.getElementById('mercadopago_user_id').value = '';
            document.getElementById('mercadopago_public_key').value = '';
            document.getElementById('mercadopago_access_token').value = '';
            document.getElementById('mercadopago_enabled').checked = false;
            updateStatusBadge('mp_status_badge', 'disconnected');
        }

        function updateStatusBadge(id, status) {
            const badge = document.getElementById(id);
            if (!badge) return;
            if (status === 'connected' || status === 'active') {
                badge.className = 'status-badge connected';
                badge.textContent = 'Conectado';
            } else {
                badge.className = 'status-badge disconnected';
                badge.textContent = 'Sin conectar';
            }
        }

        async function savePaymentConfig(e) {
            e.preventDefault();

            const stripeKey = document.getElementById('stripe_publishable_key').value.trim();
            const stripeSec = document.getElementById('stripe_secret_key').value.trim();
            const mpPub = document.getElementById('mercadopago_public_key').value.trim();
            const mpAcc = document.getElementById('mercadopago_access_token').value.trim();

            const stripeEnabled = document.getElementById('stripe_enabled').checked;
            const mpEnabled = document.getElementById('mercadopago_enabled').checked;

            const payload = {
                user_id: activeOwnerId,
                stripe_account_id: document.getElementById('stripe_account_id').value.trim(),
                stripe_publishable_key: stripeKey,
                stripe_secret_key: stripeSec,
                stripe_enabled: stripeEnabled,
                stripe_status: stripeEnabled && (stripeKey || stripeSec) ? 'connected' : 'disconnected',

                mercadopago_user_id: document.getElementById('mercadopago_user_id').value.trim(),
                mercadopago_public_key: mpPub,
                mercadopago_access_token: mpAcc,
                mercadopago_enabled: mpEnabled,
                mercadopago_status: mpEnabled && (mpPub || mpAcc) ? 'connected' : 'disconnected',

                updated_at: new Date().toISOString()
            };

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = `<i class="bi bi-arrow-repeat spin"></i> Guardando...`;

            try {
                const { error } = await sb
                    .from('tragalero_payment_config')
                    .upsert(payload, { onConflict: 'user_id' });

                if (error) throw error;
                showToast("Configuración de pagos guardada exitosamente", "success");
                updateStatusBadge('stripe_status_badge', payload.stripe_status);
                updateStatusBadge('mp_status_badge', payload.mercadopago_status);
            } catch (err) {
                console.error("Error al guardar:", err);
                showToast("Error al guardar configuración: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-floppy-fill me-2"></i> Guardar Configuración de Pagos`;
            }
        }

        async function testStripeConnection() {
            const pubKey = document.getElementById('stripe_publishable_key').value.trim();
            const secKey = document.getElementById('stripe_secret_key').value.trim();

            if (!pubKey && !secKey) {
                showToast("Ingresa tus llaves de Stripe para probar la conexión", "error");
                return;
            }

            showToast("Verificando llaves de Stripe...");
            if (pubKey.startsWith('pk_') || secKey.startsWith('sk_')) {
                showToast("Formato de llaves de Stripe correcto y activo", "success");
                updateStatusBadge('stripe_status_badge', 'connected');
            } else {
                showToast("La llave Publishable debe iniciar con 'pk_' y la Secret con 'sk_'", "error");
            }
        }

        async function testMPConnection() {
            const pubKey = document.getElementById('mercadopago_public_key').value.trim();
            const token = document.getElementById('mercadopago_access_token').value.trim();

            if (!pubKey && !token) {
                showToast("Ingresa tus credenciales de Mercado Pago para probar la conexión", "error");
                return;
            }

            showToast("Verificando credenciales de Mercado Pago...");
            if (pubKey.includes('APP_USR') || token.includes('APP_USR') || token.length > 20) {
                showToast("Credenciales de Mercado Pago válidas y listas para cobro", "success");
                updateStatusBadge('mp_status_badge', 'connected');
            } else {
                showToast("Revisa el Access Token o Public Key de Mercado Pago", "error");
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        init();
    </script>
</body>
</html>
