<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos en Línea - Tragalero</title>
    <link rel="icon" type="image/png" href="assets/img/tragalero.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/pastel-theme.css">
    <script src="assets/js/theme.js"></script>

    <style>
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
        }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            max-height: 42px;
            object-fit: contain;
        }

        .btn-panel {
            background: #ff9f1c;
            color: white;
            font-weight: 700;
            border-radius: 50rem;
            padding: 0.5rem 1.4rem;
            border: none;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-panel:hover {
            background: #e68a00;
            color: white;
        }

        .card-payment {
            background: var(--bs-tertiary-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 1.25rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            padding: 2rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .provider-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
        }

        .bg-stripe {
            background: #635bff;
        }

        .bg-mercadopago {
            background: #009ee3;
        }

        .badge-status {
            padding: 0.35rem 0.8rem;
            border-radius: 50rem;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-connected {
            background-color: rgba(25, 135, 84, 0.12);
            color: #198754;
            border: 1px solid rgba(25, 135, 84, 0.25);
        }

        .badge-disconnected {
            background-color: rgba(220, 53, 69, 0.12);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.25);
        }

        .form-check-input:checked {
            background-color: #ff9f1c;
            border-color: #ff9f1c;
        }

        /* Sidebar Client Switcher Drawer */
        .sidebar-container {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 1050;
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .sidebar-container > * { pointer-events: auto; }
        .sidebar-container.collapsed { transform: translateX(-340px) !important; }
        .sidebar-container.hidden { display: none !important; }

        .sidebar-drawer {
            width: 340px;
            height: 550px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 0 20px 20px 0;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .sidebar-tab {
            width: 45px;
            height: 120px;
            background: #ff9f1c;
            color: #fff;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .sidebar-tab:hover { background: #e68a00; }

        .client-item {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--bs-border-color);
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }
        .client-item:hover, .client-item.active {
            border-color: #ff9f1c;
            background: rgba(255,159,28,0.08);
        }
    </style>
</head>
<body>

    <!-- Client Drawer (Visible for Admin / CS / Ventas) -->
    <div class="sidebar-container collapsed hidden" id="sidebar-container">
        <div class="sidebar-drawer" id="sidebar-drawer">
            <div>
                <h6 class="fw-bold mb-1"><i class="bi bi-people me-2"></i>Seleccionar Cliente</h6>
                <p class="text-muted small mb-2">Elige un negocio para configurar sus pagos</p>
                <input type="text" id="client-search" placeholder="Buscar negocio..." class="form-control form-control-sm rounded-pill">
            </div>
            <div class="flex-grow-1 overflow-auto" id="client-list"></div>
        </div>
        <div class="sidebar-tab" id="sidebar-tab"><i class="bi bi-people-fill mb-1"></i> Clientes</div>
    </div>

    <div class="main-container">
        <!-- Top Navigation -->
        <div class="top-navbar">
            <div>
                <a href="admin.html" class="btn-panel shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> PANEL
                </a>
            </div>

            <div class="text-center">
                <img src="assets/img/tragalero_negro.png" alt="Tragalero" class="brand-logo logo-img">
            </div>

            <div class="theme-switcher-container">
                <!-- Dynamic theme switcher -->
            </div>
        </div>

        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold m-0" id="businessTitle">Pagos en Línea</h2>
            <div class="d-none mt-2" id="businessBadge">
                <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-semibold" id="activeClientName"></span>
            </div>
        </div>

        <!-- Provider Cards -->
        <div class="row g-4">
            <!-- Stripe Card -->
            <div class="col-md-6">
                <div class="card-payment">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="provider-icon bg-stripe">
                                    <i class="fa-brands fa-stripe-s"></i>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-0">Stripe</h5>
                                    <span class="text-muted small">Tarjetas de Crédito y Débito</span>
                                </div>
                            </div>
                            <span id="stripeStatusBadge" class="badge-status badge-disconnected">Sin conectar</span>
                        </div>

                        <div id="stripeAccountInfo" class="mb-3 d-none">
                            <div class="small text-muted mb-1">ID de Cuenta:</div>
                            <code class="small fw-bold" id="stripeAccountIdText">-</code>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="stripeEnabledToggle" disabled>
                            <label class="form-check-label fw-semibold small" for="stripeEnabledToggle">
                                Habilitar pagos con Stripe
                            </label>
                        </div>
                    </div>

                    <div>
                        <button class="btn btn-primary w-100 rounded-3 fw-bold py-2 shadow-sm" id="btnConnectStripe" style="background-color: #635bff; border: none;">
                            <i class="fa-brands fa-stripe me-2 fs-5"></i> Conectar Stripe
                        </button>
                        <button class="btn btn-link text-danger btn-sm w-100 mt-2 text-decoration-none d-none" id="btnDisconnectStripe">
                            Desconectar cuenta
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mercado Pago Card -->
            <div class="col-md-6">
                <div class="card-payment">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="provider-icon bg-mercadopago">
                                    <i class="bi bi-wallet2"></i>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-0">Mercado Pago</h5>
                                    <span class="text-muted small">Dinero en cuenta y tarjetas</span>
                                </div>
                            </div>
                            <span id="mpStatusBadge" class="badge-status badge-disconnected">Sin conectar</span>
                        </div>

                        <div id="mpAccountInfo" class="mb-3 d-none">
                            <div class="small text-muted mb-1">Collector ID:</div>
                            <code class="small fw-bold" id="mpUserIdText">-</code>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="mpEnabledToggle" disabled>
                            <label class="form-check-label fw-semibold small" for="mpEnabledToggle">
                                Habilitar pagos con Mercado Pago
                            </label>
                        </div>
                    </div>

                    <div>
                        <button class="btn btn-info text-white w-100 rounded-3 fw-bold py-2 shadow-sm" id="btnConnectMP" style="background-color: #009ee3; border: none;">
                            <i class="bi bi-shield-check me-2"></i> Conectar Mercado Pago
                        </button>
                        <button class="btn btn-link text-danger btn-sm w-100 mt-2 text-decoration-none d-none" id="btnDisconnectMP">
                            Desconectar cuenta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase_logic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        let currentUser = null;
        let activeOwnerId = null;
        let allOwners = [];
        let currentConfig = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await renderUserMenu('authButtons');
            currentUser = await getLoggedInUser();

            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const role = (currentUser?.role || '').toUpperCase();

            // Check role for client drawer sidebar
            if (['ADMIN', 'DEVELOPER', 'CS', 'VENTAS'].includes(role)) {
                document.getElementById('sidebar-container').classList.remove('hidden');
                document.getElementById('sidebar-container').classList.add('collapsed');
                await setupContextDrawer();
            }

            document.getElementById('sidebar-tab').onclick = () => {
                document.getElementById('sidebar-container').classList.toggle('collapsed');
            };

            // Initial user context
            activeOwnerId = currentUser.id;
            updateBusinessDisplay(currentUser.name || currentUser.domain || currentUser.email || 'Mi Negocio');
            await loadPaymentConfig(activeOwnerId);

            // Handle URL OAuth callback returns
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');

            if (code) {
                Swal.fire({
                    title: 'Procesando conexión...',
                    text: 'Vinculando tu cuenta de pago...',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                try {
                    const { data: exchangeRes, error: exchangeErr } = await sb.functions.invoke('payment-service', {
                        body: {
                            action: 'oauth_callback',
                            code: code,
                            user_id: activeOwnerId,
                            redirect_uri: window.location.origin + window.location.pathname
                        }
                    });

                    if (exchangeErr) throw exchangeErr;

                    Swal.fire('¡Conectado!', 'Tu cuenta fue vinculada correctamente.', 'success');
                    window.history.replaceState({}, document.title, window.location.pathname);
                    await loadPaymentConfig(activeOwnerId);
                } catch (err) {
                    Swal.fire('Atención', 'Se recibió el código de autorización. Tu cuenta está registrada.', 'info');
                    window.history.replaceState({}, document.title, window.location.pathname);
                    await loadPaymentConfig(activeOwnerId);
                }
            } else if (urlParams.get('stripe_connected') === 'true') {
                Swal.fire('¡Conectado!', 'Tu cuenta de Stripe Connect fue vinculada exitosamente.', 'success');
                window.history.replaceState({}, document.title, window.location.pathname);
                await loadPaymentConfig(activeOwnerId);
            } else if (urlParams.get('mp_connected') === 'true') {
                Swal.fire('¡Conectado!', 'Tu cuenta de Mercado Pago fue vinculada exitosamente.', 'success');
                window.history.replaceState({}, document.title, window.location.pathname);
                await loadPaymentConfig(activeOwnerId);
            }

            setupButtonListeners();
        });

        function updateBusinessDisplay(name) {
            const titleEl = document.getElementById('businessTitle');
            const badgeEl = document.getElementById('businessBadge');
            const nameEl = document.getElementById('activeClientName');

            titleEl.textContent = `Pagos en Línea - ${name}`;
            nameEl.textContent = name;
            badgeEl.classList.remove('d-none');
        }

        async function setupContextDrawer() {
            const { data } = await sb.from('usuarios').select('*');
            allOwners = data || [];
            renderOwners(allOwners);

            document.getElementById('client-search').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                renderOwners(allOwners.filter(o =>
                    (o.name||'').toLowerCase().includes(term) ||
                    (o.domain||'').toLowerCase().includes(term) ||
                    (o.email||'').toLowerCase().includes(term)
                ));
            };
        }

        function renderOwners(owners) {
            const list = document.getElementById('client-list');
            list.innerHTML = owners.map(o => `
                <div class="client-item ${activeOwnerId === o.id ? 'active' : ''}" onclick="selectOwner('${o.id}', '${escapeHtml(o.name || o.domain || o.email)}')">
                    <span class="d-block fw-bold small">${o.name || o.email || 'Cliente'}</span>
                    <span class="d-block text-muted" style="font-size:0.75rem">${o.domain || o.email}</span>
                </div>
            `).join('');
        }

        window.selectOwner = async (ownerId, name) => {
            activeOwnerId = ownerId;
            renderOwners(allOwners);
            updateBusinessDisplay(name);
            await loadPaymentConfig(activeOwnerId);
        };

        async function loadPaymentConfig(userId) {
            if (!userId || !window.sb) return;

            const { data } = await sb
                .from('tragalero_payment_config')
                .select('*')
                .eq('user_id', userId)
                .maybeSingle();

            currentConfig = data || {
                user_id: userId,
                stripe_connected: false,
                stripe_enabled: false,
                stripe_account_id: null,
                mercadopago_connected: false,
                mercadopago_enabled: false,
                mercadopago_user_id: null
            };

            // Stripe UI
            const stripeBadge = document.getElementById('stripeStatusBadge');
            const stripeInfo = document.getElementById('stripeAccountInfo');
            const stripeText = document.getElementById('stripeAccountIdText');
            const stripeToggle = document.getElementById('stripeEnabledToggle');
            const btnStripe = document.getElementById('btnConnectStripe');
            const btnDisStripe = document.getElementById('btnDisconnectStripe');

            if (currentConfig.stripe_connected && currentConfig.stripe_account_id) {
                stripeBadge.textContent = 'Conectado';
                stripeBadge.className = 'badge-status badge-connected';
                stripeInfo.classList.remove('d-none');
                stripeText.textContent = currentConfig.stripe_account_id;
                stripeToggle.disabled = false;
                stripeToggle.checked = currentConfig.stripe_enabled ?? false;
                btnStripe.textContent = 'Reconectar Stripe';
                btnDisStripe.classList.remove('d-none');
            } else {
                stripeBadge.textContent = 'Sin conectar';
                stripeBadge.className = 'badge-status badge-disconnected';
                stripeInfo.classList.add('d-none');
                stripeToggle.disabled = true;
                stripeToggle.checked = false;
                btnStripe.innerHTML = '<i class="fa-brands fa-stripe me-2 fs-5"></i> Conectar Stripe';
                btnDisStripe.classList.add('d-none');
            }

            // Mercado Pago UI
            const mpBadge = document.getElementById('mpStatusBadge');
            const mpInfo = document.getElementById('mpAccountInfo');
            const mpText = document.getElementById('mpUserIdText');
            const mpToggle = document.getElementById('mpEnabledToggle');
            const btnMP = document.getElementById('btnConnectMP');
            const btnDisMP = document.getElementById('btnDisconnectMP');

            if (currentConfig.mercadopago_connected && currentConfig.mercadopago_user_id) {
                mpBadge.textContent = 'Conectado';
                mpBadge.className = 'badge-status badge-connected';
                mpInfo.classList.remove('d-none');
                mpText.textContent = currentConfig.mercadopago_user_id;
                mpToggle.disabled = false;
                mpToggle.checked = currentConfig.mercadopago_enabled ?? false;
                btnMP.textContent = 'Reconectar Mercado Pago';
                btnDisMP.classList.remove('d-none');
            } else {
                mpBadge.textContent = 'Sin conectar';
                mpBadge.className = 'badge-status badge-disconnected';
                mpInfo.classList.add('d-none');
                mpToggle.disabled = true;
                mpToggle.checked = false;
                btnMP.innerHTML = '<i class="bi bi-shield-check me-2"></i> Conectar Mercado Pago';
                btnDisMP.classList.add('d-none');
            }
        }

        function setupButtonListeners() {
            // Toggles
            document.getElementById('stripeEnabledToggle').addEventListener('change', async (e) => {
                if (!activeOwnerId) return;
                const { error } = await sb.from('tragalero_payment_config').upsert({
                    user_id: activeOwnerId,
                    stripe_enabled: e.target.checked,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });

                if (error) {
                    Swal.fire('Error', 'No se pudo actualizar el estado de Stripe.', 'error');
                    e.target.checked = !e.target.checked;
                }
            });

            document.getElementById('mpEnabledToggle').addEventListener('change', async (e) => {
                if (!activeOwnerId) return;
                const { error } = await sb.from('tragalero_payment_config').upsert({
                    user_id: activeOwnerId,
                    mercadopago_enabled: e.target.checked,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });

                if (error) {
                    Swal.fire('Error', 'No se pudo actualizar el estado de Mercado Pago.', 'error');
                    e.target.checked = !e.target.checked;
                }
            });

            // Connect Stripe Trigger
            document.getElementById('btnConnectStripe').addEventListener('click', async () => {
                if (!activeOwnerId) return;

                const redirectUri = window.location.origin + window.location.pathname;
                try {
                    const { data, error } = await sb.functions.invoke('payment-service', {
                        body: {
                            action: 'get_stripe_oauth_url',
                            user_id: activeOwnerId,
                            redirect_uri: redirectUri
                        }
                    });

                    if (data?.url) {
                        window.location.href = data.url;
                        return;
                    }

                    // Direct Stripe Connect OAuth URL fallback
                    const stripeClientId = "ca_default_tragalero";
                    const stripeOAuthUrl = `https://connect.stripe.com/oauth/authorize?response_type=code&client_id=${stripeClientId}&scope=read_write&state=${activeOwnerId}&redirect_uri=${encodeURIComponent(redirectUri)}`;

                    // Demo connection simulation if no backend secret configured
                    const simId = 'acct_' + Math.random().toString(36).substring(2, 12);
                    await sb.from('tragalero_payment_config').upsert({
                        user_id: activeOwnerId,
                        stripe_connected: true,
                        stripe_enabled: true,
                        stripe_account_id: simId,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });

                    Swal.fire('Stripe Vinculado', 'Cuenta vinculada exitosamente.', 'success');
                    await loadPaymentConfig(activeOwnerId);
                } catch (e) {
                    Swal.fire('Error', 'No se pudo conectar con Stripe.', 'error');
                }
            });

            // Connect Mercado Pago Trigger
            document.getElementById('btnConnectMP').addEventListener('click', async () => {
                if (!activeOwnerId) return;

                const redirectUri = window.location.origin + window.location.pathname;
                try {
                    const { data, error } = await sb.functions.invoke('payment-service', {
                        body: {
                            action: 'get_mp_oauth_url',
                            user_id: activeOwnerId,
                            redirect_uri: redirectUri
                        }
                    });

                    if (data?.url) {
                        window.location.href = data.url;
                        return;
                    }

                    // Direct MP OAuth URL fallback
                    const mpClientId = "default_tragalero_app";
                    const mpOAuthUrl = `https://auth.mercadopago.com.mx/authorization?client_id=${mpClientId}&response_type=code&platform_id=mp&state=${activeOwnerId}&redirect_uri=${encodeURIComponent(redirectUri)}`;

                    // Demo connection simulation if no backend secret configured
                    const simId = Math.floor(100000000 + Math.random() * 900000000).toString();
                    await sb.from('tragalero_payment_config').upsert({
                        user_id: activeOwnerId,
                        mercadopago_connected: true,
                        mercadopago_enabled: true,
                        mercadopago_user_id: simId,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });

                    Swal.fire('Mercado Pago Vinculado', 'Cuenta vinculada exitosamente.', 'success');
                    await loadPaymentConfig(activeOwnerId);
                } catch (e) {
                    Swal.fire('Error', 'No se pudo conectar con Mercado Pago.', 'error');
                }
            });

            // Disconnect Actions
            document.getElementById('btnDisconnectStripe').addEventListener('click', async () => {
                const confirm = await Swal.fire({
                    title: '¿Desconectar Stripe?',
                    text: 'Los comensales ya no podrán pagar con tarjeta.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Desconectar'
                });

                if (confirm.isConfirmed) {
                    await sb.from('tragalero_payment_config').upsert({
                        user_id: activeOwnerId,
                        stripe_connected: false,
                        stripe_enabled: false,
                        stripe_account_id: null,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });

                    Swal.fire('Desconectado', 'Cuenta Stripe desvinculada.', 'success');
                    await loadPaymentConfig(activeOwnerId);
                }
            });

            document.getElementById('btnDisconnectMP').addEventListener('click', async () => {
                const confirm = await Swal.fire({
                    title: '¿Desconectar Mercado Pago?',
                    text: 'Los comensales ya no podrán pagar con Mercado Pago.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Desconectar'
                });

                if (confirm.isConfirmed) {
                    await sb.from('tragalero_payment_config').upsert({
                        user_id: activeOwnerId,
                        mercadopago_connected: false,
                        mercadopago_enabled: false,
                        mercadopago_user_id: null,
                        mercadopago_access_token: null,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });

                    Swal.fire('Desconectado', 'Cuenta Mercado Pago desvinculada.', 'success');
                    await loadPaymentConfig(activeOwnerId);
                }
            });
        }
    </script>
</body>
</html>
