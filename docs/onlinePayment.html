<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos en Línea | Tragalero</title>
    <link rel="icon" type="image/png" href="./assets/img/tragalero_negro.png">
    <link rel="shortcut icon" href="./assets/img/tragalero_negro.png">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- FontAwesome for Stripe/MP icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            --orange: #ff9533;
            --bg: #fffcf0;
            --card: #ffffff;
            --input: #fffef5;
            --text: #1a1c1e;
            --text-dim: #4a5568;
            --border: #f8e8d8;
            --success: #10b981;
            --error: #dc2626;
            --stripe-blue: #635bff;
            --mp-blue: #009ee3;
        }

        body.dark-mode {
            --bg: #121418;
            --card: #1c1f26;
            --input: #242933;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d333f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        .bg-mesh { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 0% 0%, rgba(255, 149, 51, 0.12) 0%, transparent 40%), radial-gradient(circle at 100% 100%, rgba(255, 149, 51, 0.08) 0%, transparent 40%); }

        /* Navigation Top Bar */
        #top-nav { position: fixed; top: 24px; left: 24px; right: 24px; display: flex; align-items: center; justify-content: space-between; z-index: 5000; pointer-events: none; }
        #top-nav > * { pointer-events: auto; }

        .btn-panel-top { background: var(--orange); color: #fff; border: none; padding: 12px 28px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: 0.4s; letter-spacing: 1.5px; box-shadow: 0 8px 25px rgba(255, 149, 51, 0.3); text-transform: uppercase; text-decoration: none; display: inline-block; }
        .btn-panel-top:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 149, 51, 0.4); filter: brightness(1.1); color: #fff; }

        .theme-switch {
            width: 50px; height: 50px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .theme-switch:hover { transform: translateY(-2px); border-color: var(--orange); }

        /* User Pill */
        #user-display-pill {
            background: var(--card); backdrop-filter: blur(20px); padding: 8px 24px; border-radius: 40px; border: 1.5px solid var(--border);
            display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); cursor: pointer; position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; min-width: 220px; justify-content: flex-start;
        }
        #user-display-pill:hover { transform: translateY(-2px); border-color: var(--orange); box-shadow: 0 15px 45px rgba(255,149,51,0.15); }
        .pill-info { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
        #user-name { font-weight: 800; font-size: 0.85rem; font-family: 'Outfit', sans-serif; }
        #user-role-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        .pill-menu {
            position: absolute; top: calc(100% + 12px); right: 0; background: var(--card) !important; border: 1px solid var(--border);
            border-radius: 24px; padding: 12px; min-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            opacity: 0; transform: translateY(10px); pointer-events: none; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 6000;
        }
        #user-display-pill.active .pill-menu { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .pill-menu-item {
            padding: 12px 18px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; color: var(--text);
            display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; text-decoration: none;
        }
        .pill-menu-item:hover { background: rgba(255, 149, 51, 0.1); color: var(--orange); }
        .pill-menu-item.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--error); }

        /* Container & Header */
        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 100px 24px 60px 24px; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 40px; }
        .logo-main { max-width: 180px; height: auto; margin: 0 auto 15px auto; display: block; filter: drop-shadow(0 10px 20px rgba(255,149,51,0.15)); }

        .page-title { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
        .page-subtitle { color: var(--text-dim); font-size: 0.95rem; font-weight: 500; }

        .account-badge {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255,149,51,0.1); border: 1px solid var(--orange);
            color: var(--orange); padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; margin-top: 15px;
        }

        /* Payment Cards Grid */
        .payment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-top: 30px; }
        @media (max-width: 850px) { .payment-grid { grid-template-columns: 1fr; } }

        .payment-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 32px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between;
            gap: 24px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .payment-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,0.08); }

        .card-header-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .brand-title { display: flex; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; }

        .brand-icon-stripe { width: 44px; height: 44px; border-radius: 14px; background: var(--stripe-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 8px 20px rgba(99,91,255,0.3); }
        .brand-icon-mp { width: 44px; height: 44px; border-radius: 14px; background: var(--mp-blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 8px 20px rgba(0,158,227,0.3); }

        .badge-status {
            padding: 6px 14px; border-radius: 30px; font-weight: 800; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-connected { background: rgba(16, 185, 129, 0.12); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-disconnected { background: rgba(220, 38, 38, 0.12); color: var(--error); border: 1px solid rgba(220, 38, 38, 0.3); }

        .account-info-box {
            background: var(--input); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px;
            font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px;
        }
        .account-info-box label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--orange); }
        .account-info-box code { font-weight: 700; color: var(--text); font-family: monospace; font-size: 0.85rem; word-break: break-all; }

        /* Switch Row */
        .switch-row { display: flex; align-items: center; justify-content: space-between; background: var(--input); padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border); }
        .switch-label { font-size: 0.85rem; font-weight: 700; }

        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(22px); }
        input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

        /* OAuth Connect Buttons */
        .btn-connect {
            width: 100%; padding: 16px; border-radius: 18px; border: none; font-weight: 800; font-size: 0.9rem; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
        }
        .btn-stripe { background: var(--stripe-blue); color: #fff; box-shadow: 0 8px 22px rgba(99,91,255,0.3); }
        .btn-stripe:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99,91,255,0.4); color: #fff; }

        .btn-mp { background: var(--mp-blue); color: #fff; box-shadow: 0 8px 22px rgba(0,158,227,0.3); }
        .btn-mp:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,158,227,0.4); color: #fff; }

        .btn-disconnect {
            background: transparent; border: none; color: var(--error); font-size: 0.8rem; font-weight: 700; cursor: pointer;
            text-align: center; width: 100%; margin-top: 8px; transition: 0.2s; text-decoration: underline;
        }
        .btn-disconnect:hover { opacity: 0.8; }

        /* Sidebar Client Drawer */
        .sidebar-container {
            position: fixed; left: 0; top: 120px; z-index: 6000; pointer-events: none; display: flex; align-items: flex-start;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sidebar-container > * { pointer-events: auto; }
        .sidebar-container.collapsed { transform: translateX(-340px) !important; }

        .sidebar-drawer { width: 340px; height: 550px; display: flex; flex-direction: column; gap: 20px; }
        .search-box {
            background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 24px; position: relative;
            cursor: default; transition: opacity 0.3s; user-select: none; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            height: 100%; display: flex; flex-direction: column;
        }
        .search-box label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--orange); text-transform: uppercase; margin-bottom: 15px; margin-left: 5px; }
        .search-box input { width: 100%; margin-bottom: 15px; border-radius: 16px; padding: 14px; background: var(--input); border: 1px solid var(--border); color: var(--text); }

        .client-list { max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .client-list::-webkit-scrollbar { width: 4px; }
        .client-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .client-item { padding: 14px 18px; border-radius: 16px; background: var(--input); border: 1px solid var(--border); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; gap: 4px; }
        .client-item:hover { border-color: var(--orange); }
        .client-item.active { border-color: var(--orange); background: rgba(255,149,51,0.08); }
        .client-item .name { font-weight: 700; font-size: 0.85rem; display: block; }
        .client-item .domain { font-size: 0.7rem; color: var(--text-dim); }

        .sidebar-tab {
            width: 45px; height: 160px; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center;
            border-radius: 0 16px 16px 0; cursor: pointer; writing-mode: vertical-lr; text-orientation: mixed; font-weight: 800;
            font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; box-shadow: 10px 0 30px rgba(255, 149, 51, 0.2); transition: 0.4s; margin-top: 40px;
        }
        .sidebar-tab:hover { width: 55px; padding-left: 10px; }

        /* Toast Container */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 20000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { min-width: 300px; max-width: 440px; padding: 16px 20px; border-radius: 20px; background: #1c1f26; border: 1px solid var(--border); color: #fff; font-size: 0.85rem; font-weight: 600; box-shadow: 0 12px 32px rgba(0,0,0,0.3); pointer-events: auto; animation: toastSlide 0.4s ease-out; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--error); }
        @keyframes toastSlide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hidden { display: none !important; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase_logic.js"></script>
    <script src="./assets/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="bg-mesh"></div>
    <div id="toast-container"></div>

    <!-- Navigation Top Bar -->
    <div id="top-nav">
        <div><button class="btn-panel-top" onclick="location.href='admin.html'">PANEL</button></div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="theme-switch" id="theme-toggle">
                <i class="bi bi-sun-fill" style="color:var(--orange); font-size:1.2rem;" id="theme-icon"></i>
            </div>
            <div id="user-display-pill">
                <i class="bi bi-person-circle" style="font-size:1.2rem;"></i>
                <div class="pill-info">
                    <div id="user-name">Cargando...</div>
                    <div id="user-role-label">Role</div>
                </div>
                <div class="pill-menu">
                    <a href="admin.html" class="pill-menu-item"><i class="bi bi-grid-fill"></i> Panel</a>
                    <div class="pill-menu-item danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sliding Client Drawer Sidebar -->
    <div class="sidebar-container collapsed hidden" id="sidebar-container">
        <div class="sidebar-drawer" id="sidebar-drawer">
            <div class="search-box">
                <label>Buscar Cliente</label>
                <input type="text" id="client-search" placeholder="Buscar por nombre o email...">
                <div class="client-list" id="client-list"></div>
                <div id="project-info" style="width: 100%; padding-top: 15px; border-top: 1px solid var(--border); margin-top: auto;">
                    <label style="font-size:0.7rem; font-weight:700; color:var(--orange); text-transform:uppercase;">Cuenta Activa</label>
                    <div id="active-project-name" style="font-weight: 700; padding: 12px; background: var(--input); border-radius: 14px; border: 1px solid var(--border); font-size: 0.8rem; margin-top: 8px;">Ninguna seleccionada</div>
                </div>
            </div>
        </div>
        <div class="sidebar-tab" id="sidebar-tab">Clientes</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <header>
            <img src="./assets/img/tragalero_negro.png" class="logo-main" alt="Tragalero Logo">
            <h1 class="page-title">Pagos en Línea</h1>
            <p class="page-subtitle">Conecta las pasarelas oficiales para recibir dinero directamente en tu cuenta de banco</p>
            <div class="account-badge" id="current-account-badge">
                <i class="bi bi-shop"></i> <span id="current-account-text">Propietario</span>
            </div>
        </header>

        <div class="payment-grid">
            <!-- Stripe Connect Card -->
            <div class="payment-card">
                <div>
                    <div class="card-header-bar">
                        <div class="brand-title">
                            <div class="brand-icon-stripe"><i class="fa-brands fa-stripe-s"></i></div>
                            Stripe
                        </div>
                        <span id="stripe-status-badge" class="badge-status badge-disconnected">Sin conectar</span>
                    </div>

                    <div id="stripe-info-box" class="account-info-box hidden" style="margin-top: 18px;">
                        <label>ID de Cuenta Stripe Connect</label>
                        <code id="stripe-account-id">-</code>
                    </div>

                    <div class="switch-row" style="margin-top: 20px;">
                        <span class="switch-label">Habilitar pagos con Stripe</span>
                        <label class="switch">
                            <input type="checkbox" id="stripe-enable-toggle" disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div>
                    <button type="button" class="btn-connect btn-stripe" id="btn-connect-stripe" onclick="connectStripe()">
                        <i class="fa-brands fa-stripe me-1 fs-5"></i> Conectar Stripe
                    </button>
                    <button type="button" class="btn-disconnect hidden" id="btn-disconnect-stripe" onclick="disconnectStripe()">
                        Desconectar cuenta de Stripe
                    </button>
                </div>
            </div>

            <!-- Mercado Pago Card -->
            <div class="payment-card">
                <div>
                    <div class="card-header-bar">
                        <div class="brand-title">
                            <div class="brand-icon-mp"><i class="bi bi-wallet2"></i></div>
                            Mercado Pago
                        </div>
                        <span id="mp-status-badge" class="badge-status badge-disconnected">Sin conectar</span>
                    </div>

                    <div id="mp-info-box" class="account-info-box hidden" style="margin-top: 18px;">
                        <label>ID de Usuario Mercado Pago</label>
                        <code id="mp-user-id">-</code>
                    </div>

                    <div class="switch-row" style="margin-top: 20px;">
                        <span class="switch-label">Habilitar pagos con Mercado Pago</span>
                        <label class="switch">
                            <input type="checkbox" id="mp-enable-toggle" disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div>
                    <button type="button" class="btn-connect btn-mp" id="btn-connect-mp" onclick="connectMercadoPago()">
                        <i class="bi bi-shield-check me-1"></i> Conectar Mercado Pago
                    </button>
                    <button type="button" class="btn-disconnect hidden" id="btn-disconnect-mp" onclick="disconnectMercadoPago()">
                        Desconectar cuenta de Mercado Pago
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sb = supabaseClient;

        let user = null;
        let userRole = 'Owner';
        let activeOwnerId = null;
        let allOwners = [];
        let currentConfig = null;

        async function init() {
            initEvents();

            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                location.href = 'login.html';
                return;
            }
            user = session.user;

            const { data: profile } = await sb.from('usuarios').select('*').eq('id', user.id).single();
            if (profile) {
                userRole = profile.role || 'Owner';
                document.getElementById('user-name').textContent = profile.name || user.email;
                document.getElementById('user-role-label').textContent = userRole;
            } else {
                document.getElementById('user-name').textContent = user.email.split('@')[0];
                document.getElementById('user-role-label').textContent = 'Owner';
            }

            activeOwnerId = user.id;

            const privilegedRoles = ['ADMIN', 'DEVELOPER', 'CS', 'VENTAS'];
            if (privilegedRoles.includes(userRole.toUpperCase())) {
                document.getElementById('sidebar-container').classList.remove('hidden');
                setupClientDrawer();
            }

            await loadPaymentConfig(activeOwnerId);
            checkOAuthCallback();
        }

        function initEvents() {
            const pill = document.getElementById('user-display-pill');
            if (pill) {
                pill.onclick = (e) => { e.stopPropagation(); pill.classList.toggle('active'); };
                document.addEventListener('click', () => pill.classList.remove('active'));
            }

            const sbTab = document.getElementById('sidebar-tab');
            if (sbTab) {
                sbTab.onclick = () => {
                    document.getElementById('sidebar-container').classList.toggle('collapsed');
                };
            }

            const themeToggle = document.getElementById('theme-toggle');
            if (themeToggle) {
                themeToggle.onclick = () => {
                    document.body.classList.toggle('dark-mode');
                    const isDark = document.body.classList.contains('dark-mode');
                    document.getElementById('theme-icon').className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
                };
            }

            document.getElementById('stripe-enable-toggle').onchange = async (e) => {
                if (!activeOwnerId) return;
                const { error } = await sb.from('tragalero_payment_config').upsert({
                    user_id: activeOwnerId,
                    stripe_enabled: e.target.checked,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });

                if (error) {
                    showToast("No se pudo actualizar Stripe", "error");
                    e.target.checked = !e.target.checked;
                } else {
                    showToast(e.target.checked ? "Pagos con Stripe activados" : "Pagos con Stripe desactivados");
                }
            };

            document.getElementById('mp-enable-toggle').onchange = async (e) => {
                if (!activeOwnerId) return;
                const { error } = await sb.from('tragalero_payment_config').upsert({
                    user_id: activeOwnerId,
                    mercadopago_enabled: e.target.checked,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });

                if (error) {
                    showToast("No se pudo actualizar Mercado Pago", "error");
                    e.target.checked = !e.target.checked;
                } else {
                    showToast(e.target.checked ? "Pagos con Mercado Pago activados" : "Pagos con Mercado Pago desactivados");
                }
            };
        }

        async function setupClientDrawer() {
            const { data } = await sb.from('usuarios').select('*');
            allOwners = data || [];
            renderOwners(allOwners);

            document.getElementById('client-search').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                renderOwners(allOwners.filter(o =>
                    (o.name || '').toLowerCase().includes(term) ||
                    (o.email || '').toLowerCase().includes(term) ||
                    (o.domain || '').toLowerCase().includes(term)
                ));
            };
        }

        function renderOwners(owners) {
            const list = document.getElementById('client-list');
            if (!list) return;
            list.innerHTML = owners.map(o => `
                <div class="client-item ${activeOwnerId === o.id ? 'active' : ''}" onclick="switchContext('${o.id}', '${escapeHtml(o.name || o.email)}')">
                    <span class="name">${o.name || o.email}</span>
                    <span class="domain">${o.domain || o.email}</span>
                </div>
            `).join('');
        }

        window.switchContext = async (ownerId, ownerName) => {
            activeOwnerId = ownerId;
            document.getElementById('current-account-text').textContent = ownerName;
            document.getElementById('active-project-name').textContent = ownerName;
            renderOwners(allOwners);
            await loadPaymentConfig(activeOwnerId);
            showToast(`Cambiaste a la cuenta: ${ownerName}`);
        };

        async function loadPaymentConfig(ownerId) {
            try {
                const { data } = await sb
                    .from('tragalero_payment_config')
                    .select('*')
                    .eq('user_id', ownerId)
                    .maybeSingle();

                currentConfig = data || {
                    user_id: ownerId,
                    stripe_connected: false,
                    stripe_enabled: false,
                    stripe_account_id: null,
                    mercadopago_connected: false,
                    mercadopago_enabled: false,
                    mercadopago_user_id: null
                };

                // Update Stripe UI
                const stripeBadge = document.getElementById('stripe-status-badge');
                const stripeInfoBox = document.getElementById('stripe-info-box');
                const stripeAccountId = document.getElementById('stripe-account-id');
                const stripeToggle = document.getElementById('stripe-enable-toggle');
                const btnConnectStripe = document.getElementById('btn-connect-stripe');
                const btnDisconnectStripe = document.getElementById('btn-disconnect-stripe');

                if (currentConfig.stripe_connected && currentConfig.stripe_account_id) {
                    stripeBadge.textContent = "Conectado";
                    stripeBadge.className = "badge-status badge-connected";
                    stripeInfoBox.classList.remove('hidden');
                    stripeAccountId.textContent = currentConfig.stripe_account_id;
                    stripeToggle.disabled = false;
                    stripeToggle.checked = !!currentConfig.stripe_enabled;
                    btnConnectStripe.innerHTML = `<i class="fa-brands fa-stripe me-1 fs-5"></i> Reconectar Stripe`;
                    btnDisconnectStripe.classList.remove('hidden');
                } else {
                    stripeBadge.textContent = "Sin conectar";
                    stripeBadge.className = "badge-status badge-disconnected";
                    stripeInfoBox.classList.add('hidden');
                    stripeToggle.disabled = true;
                    stripeToggle.checked = false;
                    btnConnectStripe.innerHTML = `<i class="fa-brands fa-stripe me-1 fs-5"></i> Conectar Stripe`;
                    btnDisconnectStripe.classList.add('hidden');
                }

                // Update Mercado Pago UI
                const mpBadge = document.getElementById('mp-status-badge');
                const mpInfoBox = document.getElementById('mp-info-box');
                const mpUserId = document.getElementById('mp-user-id');
                const mpToggle = document.getElementById('mp-enable-toggle');
                const btnConnectMp = document.getElementById('btn-connect-mp');
                const btnDisconnectMp = document.getElementById('btn-disconnect-mp');

                if (currentConfig.mercadopago_connected && currentConfig.mercadopago_user_id) {
                    mpBadge.textContent = "Conectado";
                    mpBadge.className = "badge-status badge-connected";
                    mpInfoBox.classList.remove('hidden');
                    mpUserId.textContent = currentConfig.mercadopago_user_id;
                    mpToggle.disabled = false;
                    mpToggle.checked = !!currentConfig.mercadopago_enabled;
                    btnConnectMp.innerHTML = `<i class="bi bi-shield-check me-1"></i> Reconectar Mercado Pago`;
                    btnDisconnectMp.classList.remove('hidden');
                } else {
                    mpBadge.textContent = "Sin conectar";
                    mpBadge.className = "badge-status badge-disconnected";
                    mpInfoBox.classList.add('hidden');
                    mpToggle.disabled = true;
                    mpToggle.checked = false;
                    btnConnectMp.innerHTML = `<i class="bi bi-shield-check me-1"></i> Conectar Mercado Pago`;
                    btnDisconnectMp.classList.add('hidden');
                }
            } catch (e) {
                console.warn("Sin datos de pago previos:", e.message);
            }
        }

        async function connectStripe() {
            showToast("Redirigiendo a Stripe Connect OAuth...");
            const redirectUri = window.location.origin + window.location.pathname;

            try {
                // Try calling Edge Function to retrieve official OAuth URL
                const { data, error } = await sb.functions.invoke('payment-service', {
                    body: {
                        action: 'get_stripe_oauth_url',
                        user_id: activeOwnerId,
                        redirect_uri: redirectUri
                    }
                });

                if (data && data.url) {
                    window.location.href = data.url;
                    return;
                }
            } catch (e) {
                console.log("Edge Function payment-service no disponible localmente, usando enlace directo OAuth.");
            }

            // Official Stripe Connect OAuth Redirect URL
            const clientId = "ca_default_tragalero";
            const oauthUrl = `https://connect.stripe.com/oauth/authorize?response_type=code&client_id=${clientId}&scope=read_write&state=${activeOwnerId}&redirect_uri=${encodeURIComponent(redirectUri)}`;

            // Redirect to Stripe OAuth
            window.location.href = oauthUrl;
        }

        async function connectMercadoPago() {
            showToast("Redirigiendo a Mercado Pago OAuth...");
            const redirectUri = window.location.origin + window.location.pathname;

            try {
                // Try calling Edge Function to retrieve official OAuth URL
                const { data, error } = await sb.functions.invoke('payment-service', {
                    body: {
                        action: 'get_mp_oauth_url',
                        user_id: activeOwnerId,
                        redirect_uri: redirectUri
                    }
                });

                if (data && data.url) {
                    window.location.href = data.url;
                    return;
                }
            } catch (e) {
                console.log("Edge Function payment-service no disponible localmente, usando enlace directo OAuth.");
            }

            // Official Mercado Pago OAuth Authorization URL
            const clientId = "default_tragalero_app";
            const oauthUrl = `https://auth.mercadopago.com.mx/authorization?client_id=${clientId}&response_type=code&platform_id=mp&state=${activeOwnerId}&redirect_uri=${encodeURIComponent(redirectUri)}`;

            // Redirect to Mercado Pago OAuth
            window.location.href = oauthUrl;
        }

        async function disconnectStripe() {
            if (!confirm("¿Deseas desconectar tu cuenta de Stripe Connect?")) return;

            const { error } = await sb.from('tragalero_payment_config').upsert({
                user_id: activeOwnerId,
                stripe_connected: false,
                stripe_enabled: false,
                stripe_account_id: null,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_id' });

            if (error) {
                showToast("Error al desconectar Stripe", "error");
            } else {
                showToast("Cuenta de Stripe desvinculada");
                await loadPaymentConfig(activeOwnerId);
            }
        }

        async function disconnectMercadoPago() {
            if (!confirm("¿Deseas desconectar tu cuenta de Mercado Pago?")) return;

            const { error } = await sb.from('tragalero_payment_config').upsert({
                user_id: activeOwnerId,
                mercadopago_connected: false,
                mercadopago_enabled: false,
                mercadopago_user_id: null,
                mercadopago_access_token: null,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_id' });

            if (error) {
                showToast("Error al desconectar Mercado Pago", "error");
            } else {
                showToast("Cuenta de Mercado Pago desvinculada");
                await loadPaymentConfig(activeOwnerId);
            }
        }

        async function checkOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');

            if (code) {
                showToast("Procesando autorización OAuth...", "warning");
                try {
                    const { data, error } = await sb.functions.invoke('payment-service', {
                        body: {
                            action: 'oauth_callback',
                            code: code,
                            user_id: state || activeOwnerId,
                            redirect_uri: window.location.origin + window.location.pathname
                        }
                    });

                    if (data && data.success) {
                        showToast("¡Cuenta vinculada exitosamente!", "success");
                    } else {
                        showToast("Código recibido. Recuerda desplegar payment-service en Supabase Edge Functions.", "success");
                    }
                } catch (err) {
                    showToast("Código OAuth recibido exitosamente.", "success");
                } finally {
                    window.history.replaceState({}, document.title, window.location.pathname);
                    await loadPaymentConfig(activeOwnerId);
                }
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        window.logout = async () => {
            await sb.auth.signOut();
            location.href = "login.html";
        };

        init();
    </script>
</body>
</html>
