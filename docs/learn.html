<!DOCTYPE html>
<html data-bs-theme="dark" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Entrenar IA - Tragalero</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <link rel="stylesheet" href="./assets/css/pastel-theme.css">
    <script src="./assets/js/theme.js"></script>

    <style>
        html, body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }

        .theme-switcher-container {
            position: absolute;
            top: 12px;
            right: 15px;
            z-index: 1000;
        }

        .learn-navbar {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.05);
        }

        [data-bs-theme="light"] .learn-navbar {
            background: #ffffff;
            border-bottom-color: rgba(0, 0, 0, 0.08);
        }

        .learn-container {
            height: calc(100vh - 60px);
            display: flex;
            padding: 15px;
            gap: 15px;
            box-sizing: border-box;
            position: relative;
        }

        .panel-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 149, 51, 0.2);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        [data-bs-theme="light"] .panel-card {
            background: #ffffff;
            border-color: rgba(255, 149, 51, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Center Column: 3D Model & Speech Bubble */
        .model-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(255, 149, 51, 0.12) 0%, transparent 70%);
            border-radius: 24px;
            overflow: hidden;
        }

        .thought-bubble {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffffff 0%, #fff7ed 100%);
            color: #1e293b;
            border-radius: 24px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 12px 30px rgba(255, 149, 51, 0.3);
            border: 2px solid #ff9533;
            z-index: 10;
            max-width: 280px;
            text-align: center;
            animation: floatBubble 3.5s ease-in-out infinite;
        }

        [data-bs-theme="dark"] .thought-bubble {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            border-color: #fbbf24;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }

        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 45%;
            width: 14px;
            height: 14px;
            background: inherit;
            border-right: 2px solid #ff9533;
            border-bottom: 2px solid #ff9533;
            border-radius: 50%;
        }

        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -26px;
            left: 41%;
            width: 8px;
            height: 8px;
            background: inherit;
            border-right: 2px solid #ff9533;
            border-bottom: 2px solid #ff9533;
            border-radius: 50%;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* Form & List Columns */
        .side-panel-left {
            width: 360px;
            min-width: 320px;
        }

        .side-panel-right {
            width: 380px;
            min-width: 320px;
        }

        .method-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 149, 51, 0.2);
        }

        .method-tabs::-webkit-scrollbar {
            height: 3px;
        }

        .method-tabs::-webkit-scrollbar-thumb {
            background: rgba(255, 149, 51, 0.4);
            border-radius: 10px;
        }

        .method-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: inherit;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.76rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .method-btn:hover {
            border-color: #ff9533;
            background: rgba(255, 149, 51, 0.15);
        }

        .method-btn.active {
            background: #ff9533;
            color: #ffffff;
            border-color: #ff9533;
            font-weight: 600;
        }

        .file-drop-zone {
            border: 2px dashed rgba(255, 149, 51, 0.4);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 149, 51, 0.03);
            transition: all 0.2s ease;
        }

        .file-drop-zone:hover {
            border-color: #ff9533;
            background: rgba(255, 149, 51, 0.1);
        }

        .knowledge-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .knowledge-list::-webkit-scrollbar {
            width: 5px;
        }

        .knowledge-list::-webkit-scrollbar-thumb {
            background: rgba(255, 149, 51, 0.3);
            border-radius: 10px;
        }

        .knowledge-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        [data-bs-theme="light"] .knowledge-item {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .knowledge-item:hover {
            border-color: #ff9533;
            transform: translateY(-2px);
        }

        /* Responsive adjustments for mobile without vertical scroll */
        @media (max-width: 991.98px) {
            .learn-container {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }
            .side-panel-left, .side-panel-right {
                width: 100%;
                min-width: auto;
                height: 45%;
            }
            .model-stage {
                height: 40%;
                flex: none;
            }
            .thought-bubble {
                font-size: 0.85rem;
                padding: 8px 14px;
                top: 4%;
            }
        }
    </style>
</head>

<body>
    <!-- Top Bar -->
    <div class="learn-navbar">
        <div class="d-flex align-items-center gap-3">
            <a href="./admin.html" class="btn btn-outline-warning btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Panel
            </a>
            <div class="fw-bold fs-5 text-warning d-flex align-items-center gap-2">
                <i class="bi bi-brain"></i> Centro de Aprendizaje IA
            </div>
        </div>

        <div class="theme-switcher-container d-flex align-items-center bg-white bg-opacity-10 p-2 rounded-pill shadow-sm">
            <div id="authButtons" class="me-3 ps-2"></div>
            <div class="theme-switcher-bar d-flex">
                <button class="theme-btn" data-theme-value="light" title="Modo Amarillo"><i class="bi bi-sun-fill"></i></button>
                <button class="theme-btn" data-theme-value="dark" title="Modo Oscuro"><i class="bi bi-moon-stars-fill"></i></button>
                <button class="theme-btn" data-theme-value="medio" title="Modo Suave"><i class="bi bi-palette-fill"></i></button>
            </div>
        </div>
    </div>

    <!-- Main Workspace (Fit to screen 100vh) -->
    <div class="learn-container">
        <!-- Left Panel: Multi-Method Data Ingestion Form -->
        <div class="panel-card side-panel-left">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h6 class="fw-bold mb-0 text-warning"><i class="bi bi-plus-circle me-1"></i> Enseñar a la IA</h6>
                <span class="badge bg-warning text-dark rounded-pill">Métodos</span>
            </div>

            <!-- Method Selector Tabs -->
            <div class="method-tabs">
                <button class="method-btn active" onclick="switchMethod('text')" id="tab-text"><i class="bi bi-pencil-square"></i> Texto Libre</button>
                <button class="method-btn" onclick="switchMethod('sheet')" id="tab-sheet"><i class="bi bi-file-earmark-spreadsheet"></i> Google Sheet</button>
                <button class="method-btn" onclick="switchMethod('document')" id="tab-document"><i class="bi bi-file-earmark-arrow-up"></i> Archivo</button>
                <button class="method-btn" onclick="switchMethod('url')" id="tab-url"><i class="bi bi-globe"></i> Web / URL</button>
                <button class="method-btn" onclick="switchMethod('manual')" id="tab-manual"><i class="bi bi-journal-text"></i> Manual</button>
            </div>

            <form id="knowledgeForm" class="d-flex flex-column flex-grow-1 gap-2">
                <input type="hidden" id="sourceType" value="text">

                <!-- 1. TEXTO LIBRE / NOTA -->
                <div id="method-text-section" class="method-section flex-grow-1 d-flex flex-column gap-2">
                    <div>
                        <label class="form-label small text-muted mb-1">Título o Tema</label>
                        <input type="text" id="textTitle" class="form-control form-control-sm rounded-3" placeholder="Ej: Política de Envíos o Garantía de Satisfacción">
                    </div>
                    <div class="flex-grow-1 d-flex flex-column">
                        <label class="form-label small text-muted mb-1">Información o Detalle para la IA</label>
                        <textarea id="textContent" class="form-control form-control-sm rounded-3 flex-grow-1" placeholder="Escribe cualquier dato que quieras que la IA recuerde..." style="resize: none;"></textarea>
                    </div>
                </div>

                <!-- 2. GOOGLE SHEETS / CSV -->
                <div id="method-sheet-section" class="method-section d-none flex-grow-1 d-flex flex-column gap-2">
                    <div>
                        <label class="form-label small text-muted mb-1">Nombre de la Hoja de Cálculo</label>
                        <input type="text" id="sheetTitle" class="form-control form-control-sm rounded-3" placeholder="Ej: Inventario o Lista de Precios 2025">
                    </div>
                    <div>
                        <label class="form-label small text-muted mb-1">URL Pública de Google Sheet (CSV)</label>
                        <input type="url" id="sheetUrl" class="form-control form-control-sm rounded-3" placeholder="https://docs.google.com/spreadsheets/d/.../export?format=csv">
                        <div class="form-text small opacity-75" style="font-size: 0.72rem;">Publica tu Google Sheet en la web en formato CSV para importar filas automáticamente.</div>
                    </div>
                </div>

                <!-- 3. SUBIR ARCHIVO (TXT, CSV, MD, JSON) -->
                <div id="method-document-section" class="method-section d-none flex-grow-1 d-flex flex-column gap-2">
                    <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-cloud-arrow-up fs-2 text-warning d-block mb-1"></i>
                        <span class="small fw-bold">Selecciona o arrastra un archivo</span>
                        <div class="small opacity-50" style="font-size: 0.72rem;">Soporta .txt, .csv, .md, .json, .pdf (texto)</div>
                        <input type="file" id="fileInput" class="d-none" accept=".txt,.csv,.md,.json,.text">
                    </div>
                    <div id="filePreview" class="small text-warning fw-bold text-truncate d-none"></div>
                </div>

                <!-- 4. EXTRAER DESDE WEB / URL -->
                <div id="method-url-section" class="method-section d-none flex-grow-1 d-flex flex-column gap-2">
                    <div>
                        <label class="form-label small text-muted mb-1">Título / Nombre del Sitio</label>
                        <input type="text" id="urlTitle" class="form-control form-control-sm rounded-3" placeholder="Ej: Página de Términos o Catálogo Web">
                    </div>
                    <div>
                        <label class="form-label small text-muted mb-1">Enlace / URL de la página web</label>
                        <input type="url" id="webUrl" class="form-control form-control-sm rounded-3" placeholder="https://minegocio.com/nosotros">
                    </div>
                </div>

                <!-- 5. MANUAL EXTENSO DE EMPRESA -->
                <div id="method-manual-section" class="method-section d-none flex-grow-1 d-flex flex-column gap-2">
                    <div>
                        <label class="form-label small text-muted mb-1">Título del Manual</label>
                        <input type="text" id="manualTitle" class="form-control form-control-sm rounded-3" placeholder="Ej: Manual de Operaciones y Atención al Cliente">
                    </div>
                    <div class="flex-grow-1 d-flex flex-column">
                        <label class="form-label small text-muted mb-1">Texto Completo del Manual</label>
                        <textarea id="manualContent" class="form-control form-control-sm rounded-3 flex-grow-1" placeholder="Pega el manual extenso o procedimientos aquí..." style="resize: none;"></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-2">
                    <button type="submit" id="saveKnowledgeBtn" class="btn btn-warning btn-sm w-100 fw-bold rounded-pill">
                        <i class="bi bi-lightbulb-fill me-1"></i> Enseñar a la IA
                    </button>
                </div>
            </form>
        </div>

        <!-- Center Panel: 3D Character Stage -->
        <div class="model-stage panel-card">
            <div class="thought-bubble" id="thoughtBubble">
                que voy a aprender hoy
            </div>

            <model-viewer
                src="./assets/cs.gltf"
                alt="Asistente IA Tragalero"
                camera-controls
                auto-rotate
                disable-zoom
                disable-pan
                interaction-prompt="none"
                shadow-intensity="1"
                exposure="1"
                camera-orbit="0deg 75deg 105%"
                field-of-view="30deg"
                loading="eager"
                style="width: 100%; height: 100%; background: transparent; --poster-color: transparent; outline: none; cursor: grab;">
            </model-viewer>
        </div>

        <!-- Right Panel: Knowledge Memory List -->
        <div class="panel-card side-panel-right">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h6 class="fw-bold mb-0 text-warning"><i class="bi bi-journal-check me-1"></i> Memoria Aprendida</h6>
                <span class="badge bg-secondary rounded-pill" id="knowledgeCount">0 datos</span>
            </div>

            <div class="mb-2">
                <input type="text" id="searchKnowledge" class="form-control form-control-sm rounded-pill" placeholder="Filtrar datos aprendidos..." onkeyup="filterKnowledge()">
            </div>

            <div class="knowledge-list" id="knowledgeList">
                <div class="text-center text-muted p-4">
                    <i class="bi bi-arrow-repeat spin me-2"></i> Cargando memoria de la IA...
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase_logic.js"></script>
    <script src="./assets/js/tragaleroChatbot.js"></script>

    <script>
        let currentUser = null;
        let activeUserId = null;
        let allKnowledge = [];
        let currentFileText = "";
        let currentFileName = "";

        document.addEventListener('DOMContentLoaded', async () => {
            await renderUserMenu('authButtons');
            currentUser = await getLoggedInUser();

            if (!currentUser) {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('demo')) {
                    currentUser = { id: '00000000-0000-0000-0000-000000000000', name: 'Restaurante Demo', role: 'Owner' };
                } else {
                    window.location.href = './login.html';
                    return;
                }
            }

            activeUserId = currentUser.id;
            loadKnowledge();

            document.getElementById('knowledgeForm').addEventListener('submit', handleSaveKnowledge);
            setupFileHandler();
        });

        function switchMethod(method) {
            document.getElementById('sourceType').value = method;
            document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${method}`).classList.add('active');

            document.querySelectorAll('.method-section').forEach(s => s.classList.add('d-none'));
            document.getElementById(`method-${method}-section`).classList.remove('d-none');
        }

        function setupFileHandler() {
            const input = document.getElementById('fileInput');
            input.onchange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    currentFileName = file.name;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        currentFileText = evt.target.result;
                        const prev = document.getElementById('filePreview');
                        prev.textContent = `📄 Archivo cargado: ${file.name} (${Math.round(file.size / 1024)} KB)`;
                        prev.classList.remove('d-none');
                    };
                    reader.readAsText(file);
                }
            };
        }

        async function loadKnowledge() {
            const listEl = document.getElementById('knowledgeList');
            const countEl = document.getElementById('knowledgeCount');

            try {
                const sb = window.supabaseClient || supabaseClient;
                const { data, error } = await sb
                    .from('tragalero_knowledge')
                    .select('*')
                    .eq('user_id', activeUserId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allKnowledge = data || [];
                countEl.textContent = `${allKnowledge.length} dato${allKnowledge.length === 1 ? '' : 's'}`;
                renderKnowledgeList(allKnowledge);
            } catch (err) {
                console.error("Error al cargar conocimiento:", err);
                listEl.innerHTML = `<div class="text-center text-danger p-3"><i class="bi bi-exclamation-triangle me-1"></i> Error al cargar datos: ${escapeHtml(err.message)}</div>`;
            }
        }

        function getSourceIcon(type) {
            switch(type) {
                case 'sheet': return 'bi-file-earmark-spreadsheet text-success';
                case 'document': return 'bi-file-earmark-arrow-up text-info';
                case 'url': return 'bi-globe text-primary';
                case 'manual': return 'bi-journal-text text-warning';
                default: return 'bi-pencil-square text-warning';
            }
        }

        function renderKnowledgeList(items) {
            const listEl = document.getElementById('knowledgeList');
            if (!items || items.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center text-muted p-4">
                        <i class="bi bi-lightbulb fs-2 d-block mb-2 text-warning opacity-50"></i>
                        Aún no le has enseñado datos a tu IA.<br>¡Elige una opción a la izquierda para comenzar!
                    </div>
                `;
                return;
            }

            listEl.innerHTML = items.map(item => `
                <div class="knowledge-item">
                    <div class="d-flex align-items-center justify-content-between mb-1">
                        <span class="small fw-bold d-flex align-items-center gap-1">
                            <i class="bi ${getSourceIcon(item.source_type)}"></i> ${escapeHtml(item.source_type || 'texto').toUpperCase()}
                        </span>
                        <button class="btn btn-sm btn-link text-danger p-0" onclick="deleteKnowledge(${item.id})" title="Eliminar de memoria"><i class="bi bi-trash"></i></button>
                    </div>
                    <div class="fw-bold small text-truncate" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
                    <div class="small opacity-75 text-break mt-1" style="font-size: 0.8rem; max-height: 60px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;">${escapeHtml(item.content)}</div>
                </div>
            `).join('');
        }

        function filterKnowledge() {
            const query = document.getElementById('searchKnowledge').value.toLowerCase().trim();
            if (!query) {
                renderKnowledgeList(allKnowledge);
                return;
            }
            const filtered = allKnowledge.filter(k =>
                k.title.toLowerCase().includes(query) ||
                k.content.toLowerCase().includes(query)
            );
            renderKnowledgeList(filtered);
        }

        async function handleSaveKnowledge(e) {
            e.preventDefault();

            const method = document.getElementById('sourceType').value;
            let title = "";
            let content = "";

            if (method === 'text') {
                title = document.getElementById('textTitle').value.trim() || "Nota de Negocio";
                content = document.getElementById('textContent').value.trim();
            } else if (method === 'sheet') {
                title = document.getElementById('sheetTitle').value.trim() || "Google Sheet";
                const url = document.getElementById('sheetUrl').value.trim();
                if (url) {
                    try {
                        const res = await fetch(url);
                        content = await res.text();
                    } catch (err) {
                        content = `Hoja vinculada: ${url}`;
                    }
                }
            } else if (method === 'document') {
                title = currentFileName || "Documento Adjunto";
                content = currentFileText;
            } else if (method === 'url') {
                title = document.getElementById('urlTitle').value.trim() || "Página Web";
                const url = document.getElementById('webUrl').value.trim();
                content = `Sitio web importado: ${url}`;
            } else if (method === 'manual') {
                title = document.getElementById('manualTitle').value.trim() || "Manual de Empresa";
                content = document.getElementById('manualContent').value.trim();
            }

            if (!content) {
                alert("Por favor ingresa o sube información válida para que la IA aprenda.");
                return;
            }

            const saveBtn = document.getElementById('saveKnowledgeBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i class="bi bi-arrow-repeat spin me-1"></i> Aprendiendo...`;

            try {
                const sb = window.supabaseClient || supabaseClient;
                const payload = {
                    user_id: activeUserId,
                    source_type: method,
                    category: 'general',
                    title: title,
                    content: content,
                    updated_at: new Date().toISOString()
                };

                const { error } = await sb.from('tragalero_knowledge').insert(payload);
                if (error) throw error;

                // Animate speech bubble confirmation
                const bubble = document.getElementById('thoughtBubble');
                bubble.textContent = `¡Aprendí "${title}"! 🧠✨`;
                setTimeout(() => {
                    bubble.textContent = 'que voy a aprender hoy';
                }, 4000);

                resetForm();
                await loadKnowledge();
            } catch (err) {
                alert("Error al guardar conocimiento: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="bi bi-lightbulb-fill me-1"></i> Enseñar a la IA`;
            }
        }

        async function deleteKnowledge(id) {
            if (!confirm("¿Deseas eliminar este dato de la memoria de la IA?")) return;

            try {
                const sb = window.supabaseClient || supabaseClient;
                const { error } = await sb.from('tragalero_knowledge').delete().eq('id', id);
                if (error) throw error;
                await loadKnowledge();
            } catch (err) {
                alert("Error al eliminar: " + err.message);
            }
        }

        function resetForm() {
            document.getElementById('textTitle').value = '';
            document.getElementById('textContent').value = '';
            document.getElementById('sheetTitle').value = '';
            document.getElementById('sheetUrl').value = '';
            document.getElementById('urlTitle').value = '';
            document.getElementById('webUrl').value = '';
            document.getElementById('manualTitle').value = '';
            document.getElementById('manualContent').value = '';
