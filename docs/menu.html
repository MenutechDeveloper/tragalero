<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Tragalero</title>
    <link rel="icon" type="image/png" href="./assets/img/tragalero_negro.png">
    <link rel="shortcut icon" href="./assets/img/tragalero_negro.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tragalero Theme & Components -->
    <link rel="stylesheet" href="./assets/css/pastel-theme.css">
    <script src="https://www.fbgcdn.com/embedder/js/ewm2.js"></script>
    <script src="./assets/js/theme.js"></script>
    <script src="./tragaleroUI.js"></script>

    <style>
        :root {
            --orange: #ff9533;
            --bg: #fffcf0;
            --card: #ffffff;
            --input: #fffef5;
            --text: #1a1c1e;
            --text-dim: #4a5568;
            --border: #f8e8d8;
        }

        [data-bs-theme="dark"] {
            --bg: #121418;
            --card: #1c1f26;
            --input: #242933;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #2d333f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; padding-bottom: 60px; }

        .bg-mesh { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 0% 0%, rgba(255, 149, 51, 0.12) 0%, transparent 40%), radial-gradient(circle at 100% 100%, rgba(255, 149, 51, 0.08) 0%, transparent 40%); }

        .menu-container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

        /* Cover Header */
        .cover-wrapper {
            position: relative; width: 100%; height: 260px; border-radius: 28px; overflow: hidden;
            background: var(--input); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .cover-wrapper img, .cover-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .cover-overlay {
            position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 60%);
            display: flex; align-items: flex-end; padding: 24px;
        }
        .header-title-box { display: flex; align-items: center; gap: 16px; width: 100%; }
        .biz-logo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: var(--card); flex-shrink: 0; }
        .biz-name { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 800; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.4); margin: 0; }

        /* Action Buttons Header */
        .action-bar { display: flex; gap: 12px; margin-bottom: 30px; }
        .action-bar > * { flex: 1; }

        /* Category Nav */
        .category-nav {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 24px;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-pill {
            padding: 10px 20px; border-radius: 20px; background: var(--card); border: 1px solid var(--border);
            font-size: 0.85rem; font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s;
            color: var(--text-dim); text-decoration: none;
        }
        .cat-pill:hover, .cat-pill.active { background: var(--orange); color: #ffffff; border-color: var(--orange); }

        /* Categories & Dishes */
        .category-block { margin-bottom: 40px; scroll-margin-top: 20px; }
        .category-header-title { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
        .category-desc { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
        .category-img-banner { width: 100%; height: 160px; object-fit: cover; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); }

        .dishes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 768px) {
            .dishes-grid { grid-template-columns: 1fr; }
            .cover-wrapper { height: 200px; }
            .biz-name { font-size: 1.4rem; }
        }

        .dish-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px;
            display: flex; gap: 16px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative; overflow: hidden; cursor: pointer;
        }
        .dish-card:hover { border-color: var(--orange); transform: translateY(-2px); }

        /* Floating Cart Button */
        .cart-float-btn {
            position: fixed; bottom: 24px; right: 24px; z-index: 5000;
            background: var(--orange); color: #ffffff; border: none; padding: 14px 24px;
            border-radius: 30px; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center;
            gap: 12px; box-shadow: 0 10px 30px rgba(255,149,51,0.4); cursor: pointer; transition: 0.3s;
        }
        .cart-float-btn:hover { transform: scale(1.05); filter: brightness(1.05); }
        .cart-badge { background: #ffffff; color: var(--orange); padding: 2px 10px; border-radius: 12px; font-size: 0.85rem; }
        .dish-thumb { width: 90px; height: 90px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--input); }
        .dish-details { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .dish-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .dish-description { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; margin-bottom: 10px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .dish-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .dish-price { font-weight: 800; color: var(--orange); font-size: 1.05rem; }

        .size-badge { font-size: 0.7rem; background: var(--input); border: 1px solid var(--border); padding: 2px 8px; border-radius: 8px; color: var(--text-dim); margin-right: 4px; }

        /* Footer Branding */
        .footer-branding { text-align: center; margin-top: 60px; font-size: 0.85rem; color: var(--text-dim); }
        .footer-branding a { color: var(--orange); font-weight: 800; text-decoration: none; }

        .loader-center { text-align: center; padding: 80px 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Supabase Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase_logic.js"></script>
</head>
<body>
    <div class="bg-mesh"></div>

    <div class="menu-container">
        <div id="loading-state" class="loader-center">
            <div class="spinner"></div>
            <p style="font-weight: 700; color: var(--text-dim);">Cargando menú...</p>
        </div>

        <div id="error-state" class="loader-center d-none">
            <i class="bi bi-exclamation-circle text-warning" style="font-size: 2.5rem;"></i>
            <h3 class="mt-3 font-outfit font-bold">Menú no encontrado</h3>
            <p class="text-secondary" id="error-message">No se pudo cargar el menú solicitado.</p>
        </div>

        <div id="menu-app" class="d-none">
            <!-- Floating Cart Button -->
            <button id="cart-float" class="cart-float-btn d-none" onclick="openCartModal()">
                <i class="bi bi-cart-fill"></i>
                <span>Ver Pedido</span>
                <span class="cart-badge" id="cart-count">0</span>
            </button>

            <!-- Cover Header -->
            <div class="cover-wrapper" id="cover-container">
                <div id="cover-media"></div>
                <div class="cover-overlay">
                    <div class="header-title-box">
                        <img id="biz-logo" src="./assets/img/tragalero_negro.png" class="biz-logo d-none" alt="Logo">
                        <h1 id="biz-name" class="biz-name">Restaurante</h1>
                    </div>
                </div>
            </div>

            <!-- Category Pills Nav -->
            <div class="category-nav" id="category-pills"></div>

            <!-- Categories and Dishes Content -->
            <div id="categories-container"></div>

            <!-- Footer Branding -->
            <div class="footer-branding">
                Powered by <a href="https://tragalero.com" target="_blank">Tragalero</a>
            </div>
        </div>
    </div>

    <!-- Dish Modal -->
    <div class="modal fade" id="dishModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg" style="background: var(--card); color: var(--text);">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-outfit fw-bold" id="modal-dish-name">Platillo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="modal-dish-img" src="" class="w-100 rounded-3 mb-3 object-fit-cover d-none" style="height:200px;">
                    <p id="modal-dish-desc" class="text-secondary small mb-3"></p>

                    <div id="modal-dish-sizes-wrapper" class="mb-3 d-none">
                        <label class="form-label fw-bold small text-uppercase" style="color:var(--orange)">Tamaño / Opción</label>
                        <div id="modal-dish-sizes" class="d-flex flex-wrap gap-2"></div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mt-4">
                        <label class="fw-bold small text-uppercase mb-0" style="color:var(--orange)">Cantidad</label>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-outline-secondary btn-sm rounded-circle px-2" onclick="adjustModalQty(-1)">-</button>
                            <span id="modal-dish-qty" class="fw-bold px-2">1</span>
                            <button class="btn btn-outline-secondary btn-sm rounded-circle px-2" onclick="adjustModalQty(1)">+</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-warning w-100 py-2 rounded-3 fw-bold text-white shadow-sm" style="background:var(--orange); border:none;" onclick="addModalItemToCart()">
                        Agregar al Pedido • <span id="modal-dish-total">$0.00</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart / Checkout Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg" style="background: var(--card); color: var(--text);">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-outfit fw-bold"><i class="bi bi-bag-check me-2" style="color:var(--orange)"></i>Tu Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items-list" class="mb-3"></div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-4 fw-bold">
                        <span>Total:</span>
                        <span id="cart-total-price" class="fs-5" style="color:var(--orange)">$0.00</span>
                    </div>

                    <h6 class="font-outfit fw-bold mb-3" style="color:var(--orange)">Datos de Envío / Contacto</h6>
                    <div class="mb-2">
                        <input type="text" id="order-client-name" class="form-control rounded-3" placeholder="Nombre completo">
                    </div>
                    <div class="mb-2">
                        <input type="tel" id="order-client-phone" class="form-control rounded-3" placeholder="Teléfono de contacto">
                    </div>
                    <div class="mb-2">
                        <input type="text" id="order-client-address" class="form-control rounded-3" placeholder="Dirección / Número de Mesa">
                    </div>
                    <div class="mb-2">
                        <textarea id="order-notes" class="form-control rounded-3" rows="2" placeholder="Notas adicionales (opcional)"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-warning w-100 py-3 rounded-3 fw-bold text-white shadow-sm" style="background:var(--orange); border:none;" onclick="submitOrder()">
                        Confirmar y Enviar Pedido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sb = supabaseClient;
        let menuOwnerId = null;
        let currentCategories = [];
        let cart = [];
        let activeDish = null;
        let modalQty = 1;
        let selectedSize = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadDigitalMenu();
        });

        async function loadDigitalMenu() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('n') || urlParams.get('slug');
            const domainParam = urlParams.get('domain');

            if (domainParam) {
                return fetchMenuByQuery('domain', domainParam);
            }

            if (!slug) {
                const hostname = window.location.hostname.replace(/^www\./, '');
                return fetchMenuByQuery('domain', hostname);
            }

            return fetchMenuByQuery('slug', slug);
        }

        async function fetchMenuByQuery(field, value) {
            const loadingEl = document.getElementById('loading-state');
            const errorEl = document.getElementById('error-state');
            const appEl = document.getElementById('menu-app');

            try {
                let query = sb.from('menutech_menus').select('*').eq(field, value).maybeSingle();
                let { data: menuData, error: menuErr } = await query;

                if (!menuData && field === 'slug') {
                    const domainRes = await sb.from('menutech_menus').select('*').eq('domain', value).maybeSingle();
                    menuData = domainRes.data;
                }

                if (!menuData) {
                    loadingEl.classList.add('d-none');
                    errorEl.classList.remove('d-none');
                    document.getElementById('error-message').textContent = `El menú "${value}" no se encuentra registrado.`;
                    return;
                }

                menuOwnerId = menuData.user_id;
                currentCategories = menuData.config?.categories || [];

                let cuid = '', ruid = '', name = menuData.slug || 'Restaurante', logoUrl = '';

                if (menuData.user_id) {
                    const { data: userProfile } = await sb.from('usuarios').select('*').eq('id', menuData.user_id).single();
                    if (userProfile) {
                        name = userProfile.name || userProfile.domain || name;
                    }

                    const { data: biz } = await sb.from('businesses').select('*').eq('owner_id', menuData.user_id).limit(1).maybeSingle();
                    if (biz) {
                        if (biz.name) name = biz.name;
                        if (biz.cuid) cuid = biz.cuid;
                        if (biz.ruid) ruid = biz.ruid;
                        if (biz.logo_url) logoUrl = biz.logo_url;
                    }
                }

                renderMenu(menuData, { name, cuid, ruid, logoUrl });

                loadingEl.classList.add('d-none');
                appEl.classList.remove('d-none');

            } catch (err) {
                console.error("Error loading menu:", err);
                loadingEl.classList.add('d-none');
                errorEl.classList.remove('d-none');
                document.getElementById('error-message').textContent = err.message || "Error al conectar con el servidor.";
            }
        }

        function renderMenu(menu, biz) {
            document.title = `${biz.name} | Tragalero Menú`;
            document.getElementById('biz-name').textContent = biz.name;

            if (biz.logoUrl) {
                const logoEl = document.getElementById('biz-logo');
                logoEl.src = biz.logoUrl;
                logoEl.classList.remove('d-none');
            }

            const coverMedia = document.getElementById('cover-media');
            if (menu.cover_url) {
                if (menu.cover_type === 'video') {
                    coverMedia.innerHTML = `<video src="${menu.cover_url}" autoplay loop muted playsinline></video>`;
                } else {
                    coverMedia.innerHTML = `<img src="${menu.cover_url}" alt="Portada">`;
                }
            } else {
                coverMedia.innerHTML = `<img src="https://res.cloudinary.com/dzklt0a5u/image/upload/f_auto,q_auto,w_1200/v1777151404/yiebnrm6l10wizbcdbp2.jpg" alt="Portada">`;
            }

            const pillsNav = document.getElementById('category-pills');
            const categoriesContainer = document.getElementById('categories-container');

            pillsNav.innerHTML = '';
            categoriesContainer.innerHTML = '';

            currentCategories.forEach((cat, cIdx) => {
                const catId = `cat-${cIdx}`;

                const pill = document.createElement('a');
                pill.className = `cat-pill ${cIdx === 0 ? 'active' : ''}`;
                pill.href = `#${catId}`;
                pill.textContent = cat.name || `Categoría ${cIdx + 1}`;
                pill.onclick = (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    const target = document.getElementById(catId);
                    if (target) target.scrollIntoView({ behavior: 'smooth' });
                };
                pillsNav.appendChild(pill);

                const catBlock = document.createElement('div');
                catBlock.className = 'category-block';
                catBlock.id = catId;

                let dishesHtml = (cat.dishes || []).map((dish, dIdx) => {
                    let sizesHtml = '';
                    if (dish.sizes && dish.sizes.length > 0) {
                        sizesHtml = `<div class="mt-1">${dish.sizes.map(s => `<span class="size-badge">${s.name}: $${s.price}</span>`).join('')}</div>`;
                    }

                    return `
                        <div class="dish-card" onclick="openDishModal(${cIdx}, ${dIdx})">
                            ${dish.image ? `<img src="${dish.image}" class="dish-thumb" alt="${dish.name || 'Platillo'}">` : ''}
                            <div class="dish-details">
                                <div class="dish-title">${dish.name || 'Sin Nombre'}</div>
                                ${dish.description ? `<div class="dish-description">${dish.description}</div>` : ''}
                                ${sizesHtml}
                                <div class="dish-footer">
                                    <div class="dish-price">${dish.price ? `$${parseFloat(dish.price).toFixed(2)}` : ''}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                catBlock.innerHTML = `
                    <div class="category-header-title">${cat.name || 'Categoría'}</div>
                    ${cat.description ? `<div class="category-desc">${cat.description}</div>` : ''}
                    ${cat.image ? `<img src="${cat.image}" class="category-img-banner" alt="${cat.name}">` : ''}
                    <div class="dishes-grid">${dishesHtml || '<p class="text-secondary">Sin platillos en esta categoría.</p>'}</div>
                `;

                categoriesContainer.appendChild(catBlock);
            });
        }

        function openDishModal(cIdx, dIdx) {
            activeDish = currentCategories[cIdx]?.dishes[dIdx];
            if (!activeDish) return;

            modalQty = 1;
            selectedSize = null;

            document.getElementById('modal-dish-name').textContent = activeDish.name || 'Platillo';
            document.getElementById('modal-dish-desc').textContent = activeDish.description || '';
            document.getElementById('modal-dish-qty').textContent = modalQty;

            const imgEl = document.getElementById('modal-dish-img');
            if (activeDish.image) {
                imgEl.src = activeDish.image;
                imgEl.classList.remove('d-none');
            } else {
                imgEl.classList.add('d-none');
            }

            const sizesWrapper = document.getElementById('modal-dish-sizes-wrapper');
            const sizesContainer = document.getElementById('modal-dish-sizes');
            sizesContainer.innerHTML = '';

            if (activeDish.sizes && activeDish.sizes.length > 0) {
                selectedSize = activeDish.sizes[0];
                sizesWrapper.classList.remove('d-none');

                activeDish.sizes.forEach((s, idx) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `btn btn-sm ${idx === 0 ? 'btn-warning text-white' : 'btn-outline-secondary'} rounded-pill fw-bold`;
                    btn.textContent = `${s.name} ($${s.price})`;
                    btn.onclick = () => {
                        selectedSize = s;
                        sizesContainer.querySelectorAll('button').forEach(b => {
                            b.className = 'btn btn-sm btn-outline-secondary rounded-pill fw-bold';
                        });
                        btn.className = 'btn btn-sm btn-warning text-white rounded-pill fw-bold';
                        updateModalPrice();
                    };
                    sizesContainer.appendChild(btn);
                });
            } else {
                sizesWrapper.classList.add('d-none');
            }

            updateModalPrice();
            const modal = new bootstrap.Modal(document.getElementById('dishModal'));
            modal.show();
        }

        function adjustModalQty(delta) {
            modalQty = Math.max(1, modalQty + delta);
            document.getElementById('modal-dish-qty').textContent = modalQty;
            updateModalPrice();
        }

        function updateModalPrice() {
            if (!activeDish) return;
            const unitPrice = selectedSize ? parseFloat(selectedSize.price) : parseFloat(activeDish.price || 0);
            const total = unitPrice * modalQty;
            document.getElementById('modal-dish-total').textContent = `$${total.toFixed(2)}`;
        }

        function addModalItemToCart() {
            if (!activeDish) return;

            const unitPrice = selectedSize ? parseFloat(selectedSize.price) : parseFloat(activeDish.price || 0);
            const name = selectedSize ? `${activeDish.name} (${selectedSize.name})` : activeDish.name;

            cart.push({
                name,
                unitPrice,
                qty: modalQty,
                total: unitPrice * modalQty
            });

            updateCartUI();

            const modalEl = document.getElementById('dishModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
        }

        function updateCartUI() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cart-count').textContent = count;

            const cartBtn = document.getElementById('cart-float');
            if (count > 0) {
                cartBtn.classList.remove('d-none');
            } else {
                cartBtn.classList.add('d-none');
            }
        }

        function openCartModal() {
            renderCartItems();
            const modal = new bootstrap.Modal(document.getElementById('cartModal'));
            modal.show();
        }

        function renderCartItems() {
            const listContainer = document.getElementById('cart-items-list');
            listContainer.innerHTML = '';

            let grandTotal = 0;

            if (cart.length === 0) {
                listContainer.innerHTML = '<p class="text-secondary text-center">Tu pedido está vacío.</p>';
            } else {
                cart.forEach((item, idx) => {
                    grandTotal += item.total;
                    const itemRow = document.createElement('div');
                    itemRow.className = 'd-flex justify-content-between align-items-center mb-2 pb-2 border-bottom';
                    itemRow.innerHTML = `
                        <div>
                            <div class="fw-bold small">${item.name}</div>
                            <div class="text-secondary small">$${item.unitPrice.toFixed(2)} x ${item.qty}</div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="fw-bold" style="color:var(--orange)">$${item.total.toFixed(2)}</span>
                            <button class="btn btn-sm btn-link text-danger p-0" onclick="removeCartItem(${idx})"><i class="bi bi-trash"></i></button>
                        </div>
                    `;
                    listContainer.appendChild(itemRow);
                });
            }

            document.getElementById('cart-total-price').textContent = `$${grandTotal.toFixed(2)}`;
        }

        function removeCartItem(idx) {
            cart.splice(idx, 1);
            updateCartUI();
            renderCartItems();
        }

        async function submitOrder() {
            if (cart.length === 0) return alert('Tu pedido está vacío.');

            const name = document.getElementById('order-client-name').value.trim();
            const phone = document.getElementById('order-client-phone').value.trim();
            const address = document.getElementById('order-client-address').value.trim();
            const notes = document.getElementById('order-notes').value.trim();

            if (!name || !phone) return alert('Por favor ingresa tu nombre y teléfono.');

            const grandTotal = cart.reduce((acc, item) => acc + item.total, 0);

            try {
                const { error } = await sb.from('menutech_orders').insert({
                    user_id: menuOwnerId,
                    client_name: name,
                    client_phone: phone,
                    client_address: address,
                    items: cart,
                    total: grandTotal,
                    status: 'pending',
                    notes: notes
                });

                if (error) throw error;

                alert('¡Pedido enviado con éxito! Te contactaremos pronto.');
                cart = [];
                updateCartUI();

                const modalEl = document.getElementById('cartModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();

            } catch (err) {
                console.error("Error submitting order:", err);
                alert('Error al enviar el pedido: ' + err.message);
            }
        }
    </script>
</body>
</html>
