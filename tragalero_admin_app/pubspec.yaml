name: tragalero_admin_app
description: "Aplicación Android/iOS de Tragalero Admin para impresión de tickets Ethernet Epson TM-T20III y gestión de órdenes en tiempo real."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_tts: ^3.8.0
  audioplayers: ^5.2.0
  shared_preferences: ^2.2.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
