name: menutech_admin_app
description: "App Android de Menutech Admin para impresión de tickets Epson TM-T20III Ethernet y gestión de órdenes en tiempo real."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_tts: ^3.8.0
  audioplayers: ^5.2.0
  shared_preferences: ^2.2.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
